<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HabitKit — Hábitos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%230e0e0f'/><path fill='%23a855f7' d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0e0f; --bg2: #1a1a1b; --bg3: #252526;
      --text: #ffffff; --text2: #888; --text3: #555;
      --purple: #a855f7; --nav-h: 72px; --header-h: 62px; --radius: 16px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; max-width: 430px; margin: 0 auto; overflow-x: hidden; }

    /* ── HEADER ── */
    .app-header { display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; height: var(--header-h); position: sticky; top: 0;
      background: var(--bg); z-index: 100; }
    .app-logo { font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
    .app-logo span { color: var(--purple); }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--bg3);
      background: none; color: var(--text); cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background .15s; }
    .icon-btn:hover { background: var(--bg3); }
    .icon-btn .material-icons-round { font-size: 19px; }
    .icon-btn.no-border { border: none; }

    /* ── MAIN ── */
    .main { padding: 10px 14px calc(var(--nav-h) + 20px); min-height: calc(100vh - var(--header-h)); }

    /* ── BOTTOM NAV ── */
    .bottom-nav { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--bg2); border-radius: 100px; display: flex; gap: 4px;
      padding: 7px; z-index: 200; border: 1px solid var(--bg3); }
    .nav-btn { width: 54px; height: 44px; border-radius: 100px; border: none;
      background: none; color: var(--text3); cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all .2s; }
    .nav-btn .material-icons-round { font-size: 22px; }
    .nav-btn.active { background: var(--purple); color: #fff; }

    /* ── EMPTY ── */
    .empty-state { display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 64px 24px; text-align: center; }
    .empty-state .material-icons-round { font-size: 52px; color: var(--text3); }
    .empty-state h3 { color: var(--text2); font-size: 17px; font-weight: 600; }
    .empty-state p { color: var(--text3); font-size: 13px; line-height: 1.6; max-width: 260px; }
    .empty-add-btn { background: var(--purple); color: #fff; border: none; border-radius: 12px;
      padding: 12px 24px; font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; margin-top: 4px; }

    /* ── GRID VIEW ── */
    .grid-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .habit-card-mini { border-radius: var(--radius); padding: 11px 9px;
      cursor: pointer; position: relative; min-height: 138px; display: flex;
      flex-direction: column; gap: 5px; transition: transform .12s; user-select: none; }
    .habit-card-mini:active { transform: scale(.95); }
    .card-mini-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
    .card-mini-name { font-size: 10.5px; font-weight: 700; color: #fff; line-height: 1.3;
      word-break: break-word; flex: 1; min-width: 0; }
    .card-mini-date { font-size: 9px; color: rgba(255,255,255,.5); margin-top: 2px; }
    .card-mini-check { width: 26px; height: 26px; border-radius: 7px; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0; }
    .card-mini-check .material-icons-round { font-size: 14px; }
    .card-mini-check.done { background: rgba(255,255,255,.22); color: #fff; }
    .card-mini-check.undone { background: rgba(0,0,0,.22); color: rgba(255,255,255,.35); }
    .dot-grid { display: flex; flex-direction: column; gap: 2.5px; margin-top: auto; }
    .dot-row { display: flex; gap: 2.5px; }
    .dot { width: 6.5px; height: 6.5px; border-radius: 2px; flex-shrink: 0; }

    /* ── LIST VIEW ── */
    .list-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .period-btn { background: var(--bg2); border: 1.5px solid var(--bg3); border-radius: 20px;
      padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--text);
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      font-family: inherit; white-space: nowrap; }
    .period-btn .material-icons-round { font-size: 14px; color: var(--text3); }
    .list-days-labels { display: flex; align-items: center; margin-bottom: 7px; padding: 0 12px; }
    .list-days-labels .spacer { flex: 1; min-width: 0; margin-right: 8px; }
    .list-days-cols { display: flex; }
    .day-label { display: flex; flex-direction: column; align-items: center; font-size: 10px;
      color: var(--text3); font-weight: 500; gap: 2px; }
    .day-label.today-col { color: #fff; font-weight: 700; }
    .day-label span:first-child { font-size: 9px; text-transform: uppercase; }
    .list-row { display: flex; align-items: center; gap: 8px; background: var(--bg2);
      border-radius: var(--radius); padding: 10px 12px; margin-bottom: 7px; }
    .list-icon { width: 38px; height: 38px; border-radius: 11px; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0; }
    .list-icon .material-icons-round { font-size: 19px; }
    .list-name { flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-days { display: flex; flex-shrink: 0; }
    .day-sq { border-radius: 9px; cursor: pointer; transition: transform .12s; border: none; }
    .day-sq:active { transform: scale(.85); }

    /* ── DETAIL VIEW ── */
    .detail-card { border-radius: var(--radius); padding: 15px; margin-bottom: 10px; }
    .detail-top { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
    .detail-icon { width: 46px; height: 46px; border-radius: 13px; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0; }
    .detail-icon .material-icons-round { font-size: 22px; }
    .detail-name-wrap { flex: 1; min-width: 0; }
    .detail-name { font-size: 16px; font-weight: 700; }
    .detail-streak { font-size: 11.5px; color: var(--text2); margin-top: 2px; }
    .detail-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .detail-check-btn { width: 44px; height: 44px; border-radius: 12px; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .18s; }
    .detail-check-btn .material-icons-round { font-size: 20px; color: #fff; }
    .detail-edit-btn { width: 36px; height: 36px; border-radius: 10px; border: none;
      background: rgba(255,255,255,.07); color: var(--text2); cursor: pointer;
      display: flex; align-items: center; justify-content: center; }
    .detail-edit-btn .material-icons-round { font-size: 17px; }
    .heatmap { display: flex; flex-direction: column; gap: 2.5px; overflow-x: hidden; }
    .heatmap-row { display: flex; gap: 2.5px; }
    .hm-dot { height: 9px; border-radius: 2px; flex-shrink: 0; flex: 1; min-width: 0; }
    .stats-row { display: flex; gap: 7px; margin-top: 12px; }
    .stat-pill { background: rgba(255,255,255,.05); border-radius: 10px; padding: 9px 8px;
      flex: 1; text-align: center; }
    .stat-val { font-size: 15px; font-weight: 700; }
    .stat-lbl { font-size: 9.5px; color: var(--text3); margin-top: 2px; }

    /* ── MODAL ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72);
      backdrop-filter: blur(6px); z-index: 500; display: flex;
      align-items: flex-end; justify-content: center; }
    .overlay.hidden { display: none; }
    .sheet { background: var(--bg2); border-radius: 24px 24px 0 0;
      padding: 0 20px 44px; width: 100%; max-width: 430px;
      max-height: 90vh; overflow-y: auto; scrollbar-width: none;
      animation: slideUp .28s cubic-bezier(.32,.72,0,1); }
    .sheet::-webkit-scrollbar { display: none; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 38px; height: 4px; background: var(--bg3); border-radius: 2px;
      margin: 12px auto 18px; }
    .sheet-title { font-size: 19px; font-weight: 700; margin-bottom: 22px;
      display: flex; align-items: center; justify-content: space-between; }
    .modal-label { font-size: 10.5px; font-weight: 700; color: var(--text3);
      text-transform: uppercase; letter-spacing: .8px; margin-bottom: 9px; margin-top: 18px; }
    .modal-input { width: 100%; background: var(--bg3); border: 1.5px solid transparent;
      border-radius: 12px; padding: 13px 15px; font-size: 15px; color: var(--text);
      font-family: inherit; outline: none; transition: border-color .18s; }
    .modal-input:focus { border-color: var(--purple); }
    .icon-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .icon-opt { aspect-ratio: 1; border-radius: 12px; background: var(--bg3);
      border: 2px solid transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all .14s; }
    .icon-opt .material-icons-round { font-size: 21px; color: var(--text2); }
    .icon-opt.sel { border-color: var(--purple); }
    .icon-opt.sel .material-icons-round { color: #fff; }
    .color-grid { display: flex; flex-wrap: wrap; gap: 9px; }
    .color-opt { width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      border: none; transition: all .14s; outline: 3px solid transparent; outline-offset: 3px; }
    .color-opt.sel { outline-color: #fff; }
    .btn-primary { width: 100%; padding: 15px; border-radius: 13px; background: var(--purple);
      border: none; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
      margin-top: 26px; font-family: inherit; transition: opacity .15s; }
    .btn-primary:hover { opacity: .88; }
    .btn-danger { width: 100%; padding: 15px; border-radius: 13px; background: #dc2626;
      border: none; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
      margin-top: 9px; font-family: inherit; transition: opacity .15s; }
    .btn-danger:hover { opacity: .88; }

    /* ── STATS SHEET ── */
    .stat-habit-card { background: var(--bg3); border-radius: 14px; padding: 14px;
      margin-bottom: 10px; }
    .stat-habit-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .stat-cell { background: var(--bg2); border-radius: 10px; padding: 9px 6px; text-align: center; }
    .stat-cell-val { font-size: 14px; font-weight: 700; }
    .stat-cell-lbl { font-size: 9.5px; color: var(--text3); margin-top: 2px; }

    /* ── PERIOD MENU ── */
    .period-menu { position: fixed; background: var(--bg2); border-radius: 14px;
      overflow: hidden; z-index: 600; min-width: 200px; border: 1px solid var(--bg3);
      box-shadow: 0 8px 32px rgba(0,0,0,.5); }
    .period-menu.hidden { display: none; }
    .period-opt { padding: 13px 18px; font-size: 13.5px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; transition: background .12s; }
    .period-opt:hover { background: var(--bg3); }
    .period-opt.active { color: var(--purple); }
    .period-opt .material-icons-round { font-size: 17px; opacity: 0; }
    .period-opt.active .material-icons-round { opacity: 1; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: calc(var(--nav-h) + 22px); left: 50%;
      transform: translateX(-50%); background: var(--bg2); border: 1px solid var(--bg3);
      border-radius: 100px; padding: 10px 20px; font-size: 13px; font-weight: 600;
      z-index: 900; white-space: nowrap; pointer-events: none;
      transition: opacity .25s; box-shadow: 0 4px 20px rgba(0,0,0,.4); }
    .toast.hidden { opacity: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin .9s linear infinite; display: inline-block; }
    .drive-ok    { color: #22c55e !important; }
    .drive-error { color: #ef4444 !important; }
    .drive-syncing { color: var(--text2) !important; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <a href="index.html" class="icon-btn no-border" title="Volver">
    <span class="material-icons-round">arrow_back</span>
  </a>
  <div class="app-logo">Habit<span>Kit</span></div>
  <div class="header-actions">
    <button class="icon-btn" id="driveBtn" title="Google Drive Sync">
      <span class="material-icons-round" style="color:var(--text3)">cloud_off</span>
    </button>
    <button class="icon-btn" id="statsBtn" title="Estadísticas">
      <span class="material-icons-round">bar_chart</span>
    </button>
    <button class="icon-btn" id="addBtn" title="Nuevo hábito">
      <span class="material-icons-round">add</span>
    </button>
  </div>
</header>

<!-- MAIN -->
<main class="main" id="main"></main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn" data-view="grid" title="Mosaico">
    <span class="material-icons-round">grid_view</span>
  </button>
  <button class="nav-btn" data-view="list" title="Lista">
    <span class="material-icons-round">checklist</span>
  </button>
  <button class="nav-btn active" data-view="detail" title="Detalle">
    <span class="material-icons-round">view_agenda</span>
  </button>
</nav>

<!-- ADD / EDIT HABIT SHEET -->
<div class="overlay hidden" id="habitOverlay">
  <div class="sheet" id="habitSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <span id="sheetTitle">Nuevo Hábito</span>
      <button class="icon-btn no-border" id="closeHabitBtn">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div class="modal-label">Nombre</div>
    <input type="text" class="modal-input" id="habitName" placeholder="Ej. Yoga matutino" maxlength="30" autocomplete="off">
    <div class="modal-label">Icono</div>
    <div class="icon-grid" id="iconGrid"></div>
    <div class="modal-label">Color</div>
    <div class="color-grid" id="colorGrid"></div>
    <button class="btn-primary" id="saveHabitBtn">Guardar Hábito</button>
    <button class="btn-danger" id="deleteHabitBtn" style="display:none">Eliminar Hábito</button>
  </div>
</div>

<!-- STATS SHEET -->
<div class="overlay hidden" id="statsOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <span>Estadísticas</span>
      <button class="icon-btn no-border" id="closeStatsBtn">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div id="statsContent"></div>
  </div>
</div>

<!-- PERIOD MENU -->
<div class="period-menu hidden" id="periodMenu">
  <div class="period-opt active" data-d="5">Últimos 5 días <span class="material-icons-round">check</span></div>
  <div class="period-opt" data-d="7">Últimos 7 días <span class="material-icons-round">check</span></div>
  <div class="period-opt" data-d="14">Últimas 2 semanas <span class="material-icons-round">check</span></div>
  <div class="period-opt" data-d="30">Último mes <span class="material-icons-round">check</span></div>
</div>

<!-- TOAST -->
<div class="toast hidden" id="toast"></div>

<script>
// ════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════
const ICONS = [
  'self_improvement','fitness_center','liquor','water_drop',
  'menu_book','bedtime','directions_run','restaurant',
  'medication','spa','music_note','code',
  'smoking_rooms','local_cafe','phone_android','favorite',
  'psychology','brush','language','savings',
  'eco','hiking','sports_soccer','monitor_heart',
  'wb_sunny','nights_stay','emoji_food_beverage','timer',
  'no_drinks','local_fire_department'
];

const COLORS = [
  '#ef4444','#f97316','#f59e0b','#eab308',
  '#84cc16','#22c55e','#10b981','#14b8a6',
  '#06b6d4','#3b82f6','#6366f1','#8b5cf6',
  '#a855f7','#ec4899','#f43f5e','#64748b'
];

const DAYS_ES  = ['Do','Lu','Ma','Mi','Ju','Vi','Sá'];
const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let habits      = loadHabits();
let view        = 'detail';
let listDays    = 5;
let editingId   = null;
let selIcon     = ICONS[0];
let selColor    = COLORS[4];

// ════════════════════════════════════════
// STORAGE
// ════════════════════════════════════════
function loadHabits() {
  try {
    const raw = localStorage.getItem('habitkit-v2');
    if (!raw) return [];
    return JSON.parse(raw).map(h => ({ ...h, completions: new Set(h.completions || []) }));
  } catch { return []; }
}
function persist() {
  localStorage.setItem('habitkit-v2', JSON.stringify(
    habits.map(h => ({ ...h, completions: [...h.completions] }))
  ));
  drivePersist();
}

// ════════════════════════════════════════
// DATE HELPERS
// ════════════════════════════════════════
function ds(d)  {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function today(){ return ds(new Date()); }
function shiftDay(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return ds(d);
}
function lastN(n) {
  const out = []; const base = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(base); d.setDate(base.getDate() - i); out.push(ds(d));
  }
  return out;
}
function monthDates(year, month) {
  const days = new Date(year, month + 1, 0).getDate();
  return Array.from({ length: days }, (_, i) => ds(new Date(year, month, i + 1)));
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T12:00:00');
  return `${d.getDate()} ${MONTHS_ES[d.getMonth()]} ${d.getFullYear()}`;
}

// ════════════════════════════════════════
// COLOR HELPERS
// ════════════════════════════════════════
function hexRgb(h) {
  return { r: parseInt(h.slice(1,3),16), g: parseInt(h.slice(3,5),16), b: parseInt(h.slice(5,7),16) };
}
function rgba(hex, a) {
  const {r,g,b} = hexRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}
function darken(hex, f=.18) {
  const {r,g,b} = hexRgb(hex);
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

// ════════════════════════════════════════
// STATS HELPERS
// ════════════════════════════════════════
function streak(h) {
  let cnt = 0, d = today();
  if (!h.completions.has(d)) d = shiftDay(d, -1);
  while (h.completions.has(d)) { cnt++; d = shiftDay(d, -1); }
  return cnt;
}
function rate(h, n=30) {
  return Math.round([...lastN(n)].filter(d => h.completions.has(d)).length / n * 100);
}
function bestStreak(h) {
  if (!h.completions.size) return 0;
  const sorted = [...h.completions].sort();
  let best = 1, cur = 1;
  for (let i = 1; i < sorted.length; i++) {
    const diff = (new Date(sorted[i]+'T12:00:00') - new Date(sorted[i-1]+'T12:00:00')) / 86400000;
    cur = diff === 1 ? cur + 1 : 1;
    if (cur > best) best = cur;
  }
  return best;
}

// ════════════════════════════════════════
// RENDER
// ════════════════════════════════════════
function render() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const m = document.getElementById('main');

  if (!habits.length) {
    m.innerHTML = `<div class="empty-state">
      <span class="material-icons-round">track_changes</span>
      <h3>Sin hábitos aún</h3>
      <p>Crea tu primer hábito para comenzar a rastrear tu progreso diario.</p>
      <button class="empty-add-btn" onclick="openAdd()">+ Nuevo hábito</button>
    </div>`;
    return;
  }

  if (view === 'grid')   renderGrid(m);
  else if (view === 'list')  renderList(m);
  else                   renderDetail(m);
}

// ── GRID ──
function renderGrid(el) {
  const now   = new Date();
  const year  = now.getFullYear(), month = now.getMonth();
  const dates = monthDates(year, month);
  const t     = today();
  const offset = (new Date(year, month, 1).getDay() + 6) % 7; // Mon-based

  const html = habits.map(h => {
    const done   = h.completions.has(t);
    const bg     = darken(h.color, .15);
    const rows   = Math.ceil((offset + dates.length) / 7);
    let dotHtml  = '';

    for (let r = 0; r < rows; r++) {
      let row = '';
      for (let c = 0; c < 7; c++) {
        const idx = r * 7 + c - offset;
        if (idx < 0 || idx >= dates.length) {
          row += `<div class="dot" style="background:transparent"></div>`;
        } else {
          const d   = dates[idx];
          const fut = d > t;
          const ok  = h.completions.has(d);
          row += `<div class="dot" style="background:${fut ? rgba(h.color,.07) : ok ? h.color : rgba(h.color,.18)}"></div>`;
        }
      }
      dotHtml += `<div class="dot-row">${row}</div>`;
    }

    return `<div class="habit-card-mini" style="background:${bg}"
        onclick="toggleToday('${h.id}')">
      <div class="card-mini-top">
        <div>
          <div class="card-mini-name">${esc(h.name)}</div>
          <div class="card-mini-date">${MONTHS_ES[month]} ${year}</div>
        </div>
        <div class="card-mini-check ${done?'done':'undone'}">
          <span class="material-icons-round">check</span>
        </div>
      </div>
      <div class="dot-grid">${dotHtml}</div>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="grid-view">${html}</div>`;

  // long-press to edit
  el.querySelectorAll('.habit-card-mini').forEach(card => {
    addLongPress(card, () => openEdit(card.onclick.toString().match(/'([^']+)'/)[1]));
  });
}

// ── LIST ──
function renderList(el) {
  const dates  = lastN(listDays);
  const t      = today();
  const sqW    = listDays <= 7 ? 32 : listDays <= 14 ? 24 : 19;
  const gap    = listDays <= 7 ? 5 : 4;
  const br     = listDays <= 7 ? 9 : 6;

  const labels = dates.map(d => {
    const dt    = new Date(d + 'T12:00:00');
    const isNow = d === t;
    return `<div class="day-label${isNow?' today-col':''}" style="width:${sqW}px">
      <span>${DAYS_ES[dt.getDay()]}</span><span>${dt.getDate()}</span>
    </div>`;
  }).join('');

  const rows = habits.map(h => {
    const sqs = dates.map(d => {
      const ok  = h.completions.has(d);
      const fut = d > t;
      const bg  = fut ? rgba(h.color,.07) : ok ? h.color : rgba(h.color,.16);
      return `<div class="day-sq" style="width:${sqW}px;height:${sqW}px;border-radius:${br}px;background:${bg};${!ok&&!fut?`border:1.5px solid ${rgba(h.color,.3)}`:'border:none'}"
        onclick="toggleDay('${h.id}','${d}')"></div>`;
    }).join('');

    return `<div class="list-row">
      <div class="list-icon" style="background:${darken(h.color,.22)}">
        <span class="material-icons-round" style="color:${h.color}">${h.icon}</span>
      </div>
      <div class="list-name">${esc(h.name)}</div>
      <div class="list-days" style="gap:${gap}px">${sqs}</div>
    </div>`;
  }).join('');

  const periodLabel = { 5:'Últimos 5 días', 7:'Últimos 7 días', 14:'Últimas 2 semanas', 30:'Último mes' };

  el.innerHTML = `
    <div class="list-header">
      <button class="period-btn" id="periodBtn">
        <span class="material-icons-round">calendar_month</span>
        ${periodLabel[listDays]}
        <span class="material-icons-round">expand_more</span>
      </button>
    </div>
    <div class="list-days-labels">
      <div class="spacer"></div>
      <div style="display:flex;gap:${gap}px">${labels}</div>
    </div>
    ${rows}
  `;

  document.getElementById('periodBtn').addEventListener('click', showPeriodMenu);
}

// ── DETAIL ──
function renderDetail(el) {
  const t = today();

  const cards = habits.map(h => {
    const done  = h.completions.has(t);
    const s     = streak(h);
    const r30   = rate(h, 30);

    // Build 7-row heatmap (columns = weeks)
    // Start from Mon of oldest week to show ~15 weeks
    const numWeeks = 15;
    const startD   = new Date(t + 'T12:00:00');
    // go back numWeeks*7 days then align to Monday
    startD.setDate(startD.getDate() - numWeeks * 7);
    const startDow = (startD.getDay() + 6) % 7;
    startD.setDate(startD.getDate() - startDow);

    // collect all days row by row (7 rows = days of week, cols = weeks)
    const rows = Array.from({ length: 7 }, () => []);
    const cur  = new Date(startD);
    let col = 0;
    while (ds(cur) <= t) {
      const dow = (cur.getDay() + 6) % 7; // 0=Mon
      if (dow === 0 && col > 0) {} // new week
      rows[dow].push(ds(cur));
      cur.setDate(cur.getDate() + 1);
    }
    // pad rows to same length
    const maxLen = Math.max(...rows.map(r => r.length));
    rows.forEach(r => { while (r.length < maxLen) r.push(null); });

    const hmHtml = rows.map(row =>
      `<div class="heatmap-row">${row.map(d => {
        if (!d || d > t) return `<div class="hm-dot" style="background:${rgba(h.color,.07)}"></div>`;
        return `<div class="hm-dot" style="background:${h.completions.has(d) ? h.color : rgba(h.color,.13)}"></div>`;
      }).join('')}</div>`
    ).join('');

    const cardBg  = darken(h.color, .12);
    const checkBg = done ? h.color : darken(h.color, .28);

    return `<div class="detail-card" style="background:${cardBg}">
      <div class="detail-top">
        <div class="detail-icon" style="background:${darken(h.color,.25)}">
          <span class="material-icons-round" style="color:${h.color}">${h.icon}</span>
        </div>
        <div class="detail-name-wrap">
          <div class="detail-name">${esc(h.name)}</div>
          <div class="detail-streak">${s > 0 ? `🔥 ${s} día${s!==1?'s':''} de racha` : 'Sin racha activa'}</div>
        </div>
        <div class="detail-actions">
          <button class="detail-edit-btn" onclick="openEdit('${h.id}')" title="Editar">
            <span class="material-icons-round">more_vert</span>
          </button>
          <button class="detail-check-btn" style="background:${checkBg}"
            onclick="toggleToday('${h.id}')" title="${done?'Desmarcar':'Marcar completado'}">
            <span class="material-icons-round">check</span>
          </button>
        </div>
      </div>
      <div class="heatmap">${hmHtml}</div>
      <div class="stats-row">
        <div class="stat-pill">
          <div class="stat-val" style="color:${h.color}">${s}</div>
          <div class="stat-lbl">Racha</div>
        </div>
        <div class="stat-pill">
          <div class="stat-val" style="color:${h.color}">${r30}%</div>
          <div class="stat-lbl">Último mes</div>
        </div>
        <div class="stat-pill">
          <div class="stat-val" style="color:${h.color}">${h.completions.size}</div>
          <div class="stat-lbl">Total días</div>
        </div>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = cards;
}

// ════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════
function toggleToday(id) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  const t = today();
  if (h.completions.has(t)) { h.completions.delete(t); toast('Desmarcado'); }
  else                       { h.completions.add(t);   toast('¡Completado! 🎉'); }
  persist(); render();
}
function toggleDay(id, d) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  if (h.completions.has(d)) h.completions.delete(d);
  else                       h.completions.add(d);
  persist(); render();
}

// ════════════════════════════════════════
// HABIT MODAL
// ════════════════════════════════════════
function openAdd() {
  editingId = null; selIcon = ICONS[0]; selColor = COLORS[4];
  document.getElementById('sheetTitle').textContent = 'Nuevo Hábito';
  document.getElementById('habitName').value = '';
  document.getElementById('saveHabitBtn').textContent = 'Guardar Hábito';
  document.getElementById('deleteHabitBtn').style.display = 'none';
  buildPickers();
  document.getElementById('habitOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('habitName').focus(), 350);
}
function openEdit(id) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  editingId = id; selIcon = h.icon; selColor = h.color;
  document.getElementById('sheetTitle').textContent = 'Editar Hábito';
  document.getElementById('habitName').value = h.name;
  document.getElementById('saveHabitBtn').textContent = 'Actualizar';
  document.getElementById('deleteHabitBtn').style.display = 'block';
  buildPickers();
  document.getElementById('habitOverlay').classList.remove('hidden');
}
function closeHabit() {
  document.getElementById('habitOverlay').classList.add('hidden');
  editingId = null;
}
function buildPickers() {
  document.getElementById('iconGrid').innerHTML = ICONS.map(ic =>
    `<div class="icon-opt${ic===selIcon?' sel':''}" data-ic="${ic}"
      style="${ic===selIcon?`background:${rgba(selColor,.22)}`:''}">
      <span class="material-icons-round">${ic}</span>
    </div>`
  ).join('');
  document.getElementById('colorGrid').innerHTML = COLORS.map(c =>
    `<div class="color-opt${c===selColor?' sel':''}" data-c="${c}" style="background:${c}"></div>`
  ).join('');
}
function pickIcon(ic) {
  selIcon = ic;
  document.querySelectorAll('.icon-opt').forEach(el => {
    const match = el.dataset.ic === ic;
    el.classList.toggle('sel', match);
    el.style.background = match ? rgba(selColor, .22) : '';
  });
}
function pickColor(c) {
  selColor = c;
  document.querySelectorAll('.color-opt').forEach(el => el.classList.toggle('sel', el.dataset.c === c));
  document.querySelectorAll('.icon-opt.sel').forEach(el => el.style.background = rgba(c, .22));
}
function saveHabit() {
  const name = document.getElementById('habitName').value.trim();
  if (!name) {
    document.getElementById('habitName').style.borderColor = '#ef4444';
    setTimeout(() => document.getElementById('habitName').style.borderColor = '', 1500);
    document.getElementById('habitName').focus(); return;
  }
  if (editingId) {
    const h = habits.find(h => h.id === editingId);
    h.name = name; h.icon = selIcon; h.color = selColor;
  } else {
    habits.push({ id: crypto.randomUUID(), name, icon: selIcon, color: selColor,
      completions: new Set(), createdAt: today() });
  }
  persist(); closeHabit(); render();
  toast(editingId ? 'Hábito actualizado ✓' : '¡Hábito creado! 🚀');
}
function deleteHabit() {
  if (!confirm('¿Eliminar este hábito? Se perderá todo el progreso.')) return;
  habits = habits.filter(h => h.id !== editingId);
  persist(); closeHabit(); render(); toast('Hábito eliminado');
}

// ════════════════════════════════════════
// STATS
// ════════════════════════════════════════
function openStats() {
  const el = document.getElementById('statsContent');
  if (!habits.length) {
    el.innerHTML = `<p style="text-align:center;color:var(--text3);padding:40px 0">Sin hábitos que mostrar</p>`;
  } else {
    el.innerHTML = habits.map(h => {
      const s  = streak(h), bs = bestStreak(h), r7 = rate(h, 7), tot = h.completions.size;
      return `<div class="stat-habit-card">
        <div class="stat-habit-head">
          <div style="width:38px;height:38px;border-radius:11px;background:${darken(h.color,.25)};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <span class="material-icons-round" style="color:${h.color};font-size:19px">${h.icon}</span>
          </div>
          <div>
            <div style="font-weight:700;font-size:14px">${esc(h.name)}</div>
            <div style="font-size:10.5px;color:var(--text3)">Desde ${fmtDate(h.createdAt)}</div>
          </div>
        </div>
        <div class="stat-grid">
          ${[['Racha',s+'d'],['Mejor',bs+'d'],['7 días',r7+'%'],['Total',tot]].map(([l,v])=>
            `<div class="stat-cell">
              <div class="stat-cell-val" style="color:${h.color}">${v}</div>
              <div class="stat-cell-lbl">${l}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('statsOverlay').classList.remove('hidden');
}

// ════════════════════════════════════════
// PERIOD MENU

function showPeriodMenu() {
  const btn  = document.getElementById('periodBtn');
  const menu = document.getElementById('periodMenu');
  const rect = btn.getBoundingClientRect();
  menu.style.top  = (rect.bottom + 6) + 'px';

// ════════════════════════════════════════
// LONG PRESS
// ════════════════════════════════════════
function addLongPress(el, cb) {
  let timer;
  el.addEventListener('pointerdown', () => { timer = setTimeout(cb, 600); }, { passive: true });
  el.addEventListener('pointerup',   () => clearTimeout(timer));
  el.addEventListener('pointerleave',() => clearTimeout(timer));
}

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.add('hidden'), 2200);
}

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════════════════════════════
// GOOGLE DRIVE SYNC
// ════════════════════════════════════════
const DRIVE_CLIENT_ID = '331021142047-3qofp3l7m9j68ogoqj1sr7a30fd081gl.apps.googleusercontent.com';
const DRIVE_SCOPE     = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = 'habitkit-data.json';
const DRIVE_BASE      = 'https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD    = 'https://www.googleapis.com/upload/drive/v3';

let driveToken  = null;
let driveFileId = null;
let tokenClient = null;

window.initGIS = function () {
  if (typeof google === 'undefined') return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp) => {
      if (resp.error) { setDriveStatus('error'); return; }
      driveToken = resp.access_token;
      localStorage.setItem('drive_token',  driveToken);
      localStorage.setItem('drive_expiry', Date.now() + 3500 * 1000);
      await syncWithDrive();
    }
  });
  const token  = localStorage.getItem('drive_token');
  const expiry = parseInt(localStorage.getItem('drive_expiry') || '0');
  if (token && Date.now() < expiry) { driveToken = token; syncWithDrive(); }
};

function connectDrive() {
  if (!tokenClient) { toast('Cargando Google Sign-In…'); return; }
  if (driveToken) { showDriveMenu(); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function disconnectDrive() {
  google.accounts.oauth2.revoke(driveToken, () => {});
  driveToken = null; driveFileId = null;
  ['drive_token','drive_expiry','drive_file_id'].forEach(k => localStorage.removeItem(k));
  setDriveStatus('off');
  toast('Desconectado de Google Drive');
}

async function syncWithDrive() {
  if (!driveToken) return;
  setDriveStatus('syncing');
  try {
    driveFileId = await findOrCreateFile();
    const remote = await readFile(driveFileId);
    if (remote && remote.habits && remote.habits.length) {
      habits = remote.habits.map(h => ({ ...h, completions: new Set(h.completions || []) }));
      localStorage.setItem('habitkit-v2', JSON.stringify(remote.habits));
      render();
    } else {
      await writeFile(driveFileId);
    }
    setDriveStatus('ok');
    toast('Drive sincronizado ✓');
  } catch (e) {
    console.error(e);
    setDriveStatus(e.status === 401 ? 'off' : 'error');
    if (e.status === 401) { driveToken = null; localStorage.removeItem('drive_token'); }
  }
}

async function drivePersist() {
  if (!driveToken || !driveFileId) return;
  try {
    await writeFile(driveFileId);
    setDriveStatus('ok');
  } catch (e) {
    if (e.status === 401) { driveToken = null; setDriveStatus('off'); }
    else setDriveStatus('error');
  }
}

async function findOrCreateFile() {
  const cached = localStorage.getItem('drive_file_id');
  if (cached) return cached;
  const res = await driveReq(`${DRIVE_BASE}/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILE_NAME}%27&fields=files(id)`);
  if (res.files && res.files.length) {
    localStorage.setItem('drive_file_id', res.files[0].id);
    return res.files[0].id;
  }
  const created = await driveReq(`${DRIVE_BASE}/files`, {
    method: 'POST',
    body: JSON.stringify({ name: DRIVE_FILE_NAME, parents: ['appDataFolder'] })
  });
  localStorage.setItem('drive_file_id', created.id);
  return created.id;
}

async function readFile(id) {
  try { return await driveReq(`${DRIVE_BASE}/files/${id}?alt=media`); }
  catch { return null; }
}

async function writeFile(id) {
  await driveReq(`${DRIVE_UPLOAD}/files/${id}?uploadType=media`, {
    method: 'PATCH',
    body: JSON.stringify({
      habits: habits.map(h => ({ ...h, completions: [...h.completions] })),
      updatedAt: new Date().toISOString()
    })
  });
}

async function driveReq(url, opts = {}) {
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers: { 'Authorization': `Bearer ${driveToken}`, 'Content-Type': 'application/json' },
    body: opts.body
  });
  if (!res.ok) { const e = new Error(res.status); e.status = res.status; throw e; }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

function setDriveStatus(status) {
  const btn  = document.getElementById('driveBtn');
  if (!btn) return;
  const icon = btn.querySelector('.material-icons-round');
  icon.className = 'material-icons-round';
  const map = {
    off:     { ic: 'cloud_off',  cls: '' },
    syncing: { ic: 'cloud_sync', cls: 'spinning drive-syncing' },
    ok:      { ic: 'cloud_done', cls: 'drive-ok' },
    error:   { ic: 'cloud_off',  cls: 'drive-error' }
  };
  const s = map[status] || map.off;
  icon.textContent = s.ic;
  if (s.cls) icon.classList.add(...s.cls.split(' '));
}

function showDriveMenu() {
  let menu = document.getElementById('driveMenu');
  if (!menu) {
    menu = document.createElement('div');
    menu.id = 'driveMenu';
    menu.className = 'period-menu';
    menu.style.right = '14px'; menu.style.left = 'auto';
    menu.innerHTML = `
      <div class="period-opt" onclick="syncWithDrive();document.getElementById('driveMenu').classList.add('hidden')">
        <span class="material-icons-round" style="font-size:17px;margin-right:8px;opacity:1">sync</span>Sincronizar ahora
      </div>
      <div class="period-opt" style="color:%23ef4444" onclick="disconnectDrive();document.getElementById('driveMenu').classList.add('hidden')">
        <span class="material-icons-round" style="font-size:17px;margin-right:8px;opacity:1;color:%23ef4444">link_off</span>Desconectar
      </div>`;
    document.body.appendChild(menu);
  }
  const rect = document.getElementById('driveBtn').getBoundingClientRect();
  menu.style.top = (rect.bottom + 6) + 'px';
  menu.classList.remove('hidden');
  setTimeout(() => document.addEventListener('click', () => menu.classList.add('hidden'), { once: true }), 0);
}
