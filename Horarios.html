<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Horarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #f0f0eb;
      --surface: #fff;
      --surface-2: #f7f7f4;
      --text: #1a1a18;
      --muted: #6b6b62;
      --border: #e0e0d8;
      --brand: #e8440a;
      --brand-l: #fff0eb;
      --accent: #4353ff;
      --accent-l: #eceeff;
      --success: #1d7a4c;
      --success-bg: #edfaf3;
      --success-b: #b6f0d6;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-b: #fde68a;
      --overlap: #7c3aed;
      --overlap-bg: #f5f3ff;
      --overlap-b: #ddd6fe;
      --sh: 0 2px 12px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .04);
      --shmd: 0 8px 32px rgba(0, 0, 0, .08), 0 2px 8px rgba(0, 0, 0, .04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 28px 16px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .page-header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-link {
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }

    .back-link:hover {
      background: var(--surface-2);
      border-color: var(--brand) !important;
      transform: scale(1.05);
    }

    .logo-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--brand);
      flex-shrink: 0;
    }

    h1 {
      font-family: 'Inter', sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.3px;
    }

    .tab-bar {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .tab-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn .material-symbols-outlined {
      font-size: 15px;
    }

    .tab-btn.active {
      background: var(--text);
      color: #fff;
    }

    .section {
      width: 100%;
      max-width: 1200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 26px;
      box-shadow: var(--sh);
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .section-title .material-symbols-outlined {
      font-size: 15px;
    }

    .employees-grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: 20px;
    }

    .emp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      box-shadow: var(--sh);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .add-emp-card:hover {
      border-color: var(--accent) !important;
      background: var(--accent-l) !important;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .card-name-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--brand-l);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .emp-name {
      font-family: 'Inter', sans-serif;
      font-size: 19px;
      font-weight: 800;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .saved-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid var(--success-b);
      padding: 4px 10px;
      border-radius: 999px;
      display: none;
      align-items: center;
      gap: 4px;
    }

    .saved-badge.visible {
      display: flex;
    }

    .saved-badge .material-symbols-outlined {
      font-size: 12px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      color: var(--muted);
      outline: none;
    }

    .btn-icon .material-symbols-outlined {
      font-size: 16px;
    }

    .btn-icon:hover {
      border-color: #ef4444;
      color: #ef4444;
      background: #fef2f2;
    }

    .btn-icon.btn-reset-emp:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-l);
    }

    .goal-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: var(--surface-2);
      border-radius: 12px;
      border: 1.5px solid var(--border);
    }

    .goal-row label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      flex: 1;
    }

    .goal-input {
      width: 66px;
      padding: 5px 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--surface);
      text-align: center;
      outline: none;
      transition: border-color .15s;
    }

    .goal-input:focus {
      border-color: var(--accent);
    }

    .goal-unit {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    /* CALENDAR */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 18px;
    }

    .cal-header {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      padding: 5px 0;
    }

    .cal-cell {
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      padding: 9px 6px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
      min-height: 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 3px;
    }

    .cal-cell:hover {
      border-color: var(--accent);
      background: var(--accent-l);
    }

    .cal-cell.libre {
      background: var(--success-bg);
      border-color: var(--success-b);
    }

    .cal-cell.has-overlap {
      background: var(--overlap-bg);
      border-color: var(--overlap-b);
    }

    .cal-cell.same-shift {
      background: var(--warn-bg);
      border-color: var(--warn-b);
    }

    .cal-day-name {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--muted);
    }

    .cal-cell.libre .cal-day-name {
      color: var(--success);
    }

    .cal-time-block {
      width: 100%;
      background: var(--accent);
      border-radius: 7px;
      padding: 4px 4px;
      margin-top: 2px;
    }

    .cal-time-in {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      display: block;
    }

    .cal-time-out {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, .8);
      display: block;
    }

    .cal-hrs {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }

    .cal-cell.libre .cal-hrs {
      display: none;
    }

    .libre-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--success);
      margin-top: 6px;
    }

    .overlap-dot {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--overlap);
    }

    .same-dot {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warn);
    }

    /* MODAL */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .modal-bg.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border-radius: 20px;
      padding: 28px;
      width: 90%;
      max-width: 340px;
      box-shadow: var(--shmd);
      transform: translateY(16px);
      transition: transform .2s;
    }

    .modal-bg.open .modal {
      transform: translateY(0);
    }

    .modal-title {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .modal-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .modal-select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--surface-2);
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b62' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 13px;
      padding-right: 30px;
      transition: border-color .15s;
    }

    .modal-select:focus {
      border-color: var(--accent);
    }

    .modal-btns {
      display: flex;
      gap: 10px;
    }

    .btn-cancel {
      flex: 1;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      background: var(--surface-2);
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      color: var(--muted);
    }

    .btn-ok {
      flex: 2;
      padding: 10px;
      border: none;
      border-radius: 11px;
      background: var(--text);
      font-size: 14px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      color: #fff;
    }

    .btn-ok:hover {
      background: #2d2d28;
    }

    /* COMPARE */
    .compare-section {
      width: 100%;
      max-width: 1200px;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .cmp-col-label {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      padding: 7px 4px;
    }

    .cmp-cell {
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      padding: 10px 7px;
      text-align: center;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .cmp-cell.both {
      background: var(--warn-bg);
      border-color: var(--warn-b);
    }

    .cmp-cell.only-m {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .cmp-cell.only-e {
      background: #fdf4ff;
      border-color: #e9d5ff;
    }

    .cmp-cell.both-libre {
      background: var(--success-bg);
      border-color: var(--success-b);
    }

    .cmp-emp-block {
      width: 100%;
      border-radius: 8px;
      padding: 4px 5px;
    }

    .cmp-emp-block.m-block {
      background: #3b82f6;
      color: #fff;
    }

    .cmp-emp-block.e-block {
      background: #a855f7;
      color: #fff;
    }

    .cmp-emp-block.libre-block {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-b);
    }

    .cmp-emp-name {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .3px;
      opacity: .85;
      display: block;
    }

    .cmp-emp-time {
      font-size: 10px;
      font-weight: 700;
      display: block;
    }

    .cmp-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      margin-top: 2px;
    }

    .badge-same {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .badge-overlap {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid var(--warn-b);
    }

    .badge-free {
      background: var(--success-bg);
      color: var(--success);
    }

    .cmp-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* FOOTER */
    .card-footer {
      padding-top: 14px;
      border-top: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }

    .metrics-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .metric-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .metric-value {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--brand));
      border-radius: 999px;
      transition: width .4s cubic-bezier(.4, 0, .2, 1);
    }

    .progress-fill.complete {
      background: var(--success);
    }

    .goal-msg {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--warn);
    }

    .goal-msg.met {
      color: var(--success);
    }

    .goal-msg .material-symbols-outlined {
      font-size: 14px;
    }

    /* ALERT */
    .overlap-alert {
      width: 100%;
      max-width: 1200px;
      background: var(--warn-bg);
      border: 1.5px solid var(--warn-b);
      border-radius: 14px;
      padding: 12px 18px;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--warn);
      display: none;
    }

    .overlap-alert.show {
      display: flex;
    }

    .overlap-alert .material-symbols-outlined {
      font-size: 18px;
      flex-shrink: 0;
    }

    .actions-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn-export {
      background: var(--text);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all .2s;
      box-shadow: var(--shmd);
    }

    .btn-export:hover {
      background: #2d2d28;
      transform: translateY(-1px);
    }

    .btn-export:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
      box-shadow: none;
    }

    .btn-export .material-symbols-outlined {
      font-size: 17px;
    }

    .date-controller {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
      box-shadow: var(--sh);
    }

    .date-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .date-separator {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .date-input {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--surface-2);
      outline: none;
      transition: border-color .15s;
      cursor: pointer;
    }

    .date-input:focus {
      border-color: var(--accent);
      background: var(--surface);
    }

    .emp-validity {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 2px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--text);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 11px 20px;
      border-radius: 12px;
      box-shadow: var(--shmd);
      display: flex;
      align-items: center;
      gap: 7px;
      transition: transform .3s cubic-bezier(.4, 0, .2, 1), opacity .3s;
      opacity: 0;
      z-index: 300;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast .material-symbols-outlined {
      font-size: 15px;
    }

    @media(max-width:640px) {
      .employees-grid {
        grid-template-columns: 1fr;
      }

      .cal-grid {
        gap: 3px;
      }

      .compare-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .date-controller {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="page-header">
    <div class="logo-group">
      <a href="index.html" class="back-link" aria-label="Volver al inicio">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <div class="logo-dot"></div>
      <h1>Control de Horarios</h1>
    </div>
    <div class="date-controller">
      <span class="material-symbols-outlined" style="color:var(--accent);font-size:18px;">date_range</span>
      <span class="date-label">Validez:</span>
      <input type="date" id="start-date" class="date-input" />
      <span class="date-separator">al</span>
      <input type="date" id="end-date" class="date-input" />
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-schedules">
        <span class="material-symbols-outlined">calendar_view_week</span> Horarios
      </button>
      <button class="tab-btn" id="tab-compare">
        <span class="material-symbols-outlined">compare_arrows</span> Comparar
      </button>
    </div>
  </header>

  <div class="overlap-alert" id="overlap-alert">

  <!-- ADD EMPLOYEE MODAL -->
  <div class="modal-bg" id="modal-add-emp-bg">
    <div class="modal">
      <div class="modal-title">
        <span class="material-symbols-outlined" style="color:var(--accent);font-size:20px">person_add</span>
        <span>Agregar nuevo empleado</span>
      </div>
      <div class="modal-fields">
        <div class="modal-field">
          <label for="new-emp-name">Nombre del empleado</label>
          <input type="text" id="new-emp-name" placeholder="Ej. Juan Pérez"
            style="width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:'Inter',sans-serif; color:var(--text); background:var(--surface-2); outline:none; transition:border-color .15s;"
            maxlength="30" />
        </div>
        <div class="modal-field">
          <label for="new-emp-goal">Meta de horas semanales</label>
          <input type="number" id="new-emp-goal" value="24" min="1" max="48"
            style="width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:'Inter',sans-serif; color:var(--text); background:var(--surface-2); outline:none; transition:border-color .15s;" />
        </div>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" id="btn-add-emp-cancel">Cancelar</button>
        <button class="btn-ok" id="btn-add-emp-ok">Agregar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="material-symbols-outlined">check_circle</span>
    <span id="toast-text">Guardado</span>
  </div>

  <script>
    (function () {
      'use strict';

      function initControlHorarios() {
        var DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
        var DAYS_SHORT = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

        var COLORS = ['#3b82f6', '#a855f7', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#f43f5e'];
        var employees = [];

        function makeFreeWeek() { return Array(7).fill(null).map(function () { return { i: 'libre', o: 'libre' }; }); }
        function timeLabel(v) { if (v === 'libre' || v === '' || v == null) return 'Libre'; var n = parseFloat(v); var h = Math.floor(n); var m = (n % 1 === 0) ? '00' : '30'; var ampm = h >= 12 ? 'pm' : 'am'; var dh = h % 12 === 0 ? 12 : h % 12; return dh + ':' + m + ' ' + ampm; }
        function slotHours(slot) { if (!slot || slot.i === 'libre' || slot.o === 'libre') return 0; var diff = parseFloat(slot.o) - parseFloat(slot.i); return diff > 0 ? diff : 0; }
        function findEmployee(id) { for (var i = 0; i < employees.length; i++) { if (employees[i].id === id) return employees[i]; } return null; }
        function nextEmpId() { return 'emp_' + Math.random().toString(36).substr(2, 9); }
        function buildTimeOpts(selected) { var html = '<option value="libre"' + (selected === 'libre' ? ' selected' : '') + '>Libre</option>'; for (var t = 8; t <= 18; t += 0.5) { var sel = (String(t) === String(selected)) ? ' selected' : ''; html += '<option value="' + t + '"' + sel + '>' + timeLabel(t) + '</option>'; } return html; }
        function esc(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function getMondayAndSundayOfCurrentWeek() {
          var d = new Date();
          var day = d.getDay();
          var diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
          var monday = new Date(d.setDate(diffToMonday));
          var sunday = new Date(monday);
          sunday.setDate(monday.getDate() + 6);

          var format = function (date) {
            var yyyy = date.getFullYear();
            var mm = String(date.getMonth() + 1).padStart(2, '0');
            var dd = String(date.getDate()).padStart(2, '0');
            return yyyy + '-' + mm + '-' + dd;
          };

          return { monday: format(monday), sunday: format(sunday) };
        }

        function formatDateString(str) {
          if (!str) return '';
          var parts = str.split('-');
          if (parts.length !== 3) return str;
          return parts[2] + '/' + parts[1] + '/' + parts[0];
        }

        function getValidityText() {
          var startEl = document.getElementById('start-date');
          var endEl = document.getElementById('end-date');
          var start = startEl ? startEl.value : localStorage.getItem('validity_start');
          var end = endEl ? endEl.value : localStorage.getItem('validity_end');

          if (start && end) {
            return 'Vigencia: ' + formatDateString(start) + ' al ' + formatDateString(end);
          } else if (start) {
            return 'Vigencia desde: ' + formatDateString(start);
          } else if (end) {
            return 'Vigencia hasta: ' + formatDateString(end);
          } else {
            return 'Sin período definido';
          }
        }

        function saveValidityDates() {
          var startEl = document.getElementById('start-date');
          var endEl = document.getElementById('end-date');
          if (startEl && endEl) {
            localStorage.setItem('validity_start', startEl.value);
            localStorage.setItem('validity_end', endEl.value);
          }
        }

        function loadValidityDates() {
          var start = localStorage.getItem('validity_start');
          var end = localStorage.getItem('validity_end');
          if (!start || !end) {
            var currentWeek = getMondayAndSundayOfCurrentWeek();
            if (!start) start = currentWeek.monday;
            if (!end) end = currentWeek.sunday;
          }
          var startEl = document.getElementById('start-date');
          var endEl = document.getElementById('end-date');
          if (startEl) startEl.value = start;
          if (endEl) endEl.value = end;
        }

        function updateValidityDisplay() {
          var txt = getValidityText();
          var elements = document.querySelectorAll('.emp-validity');
          elements.forEach(function (el) {
            el.textContent = txt;
          });
        }

        function saveAllEmployees() {
          try {
            localStorage.setItem('employees_list', JSON.stringify(employees));
          } catch (e) { }
        }

        function loadAllEmployees() {
          try {
            var stored = localStorage.getItem('employees_list');
            if (stored) {
              employees = JSON.parse(stored);
            }
          } catch (e) { }

          if (employees.length === 0) {
            employees = [
              { id: 'mariela', name: 'Mariela', goal: 24, slots: makeFreeWeek(), color: COLORS[0] },
              { id: 'erick', name: 'Erick', goal: 24, slots: makeFreeWeek(), color: COLORS[1] }
            ];

            employees.forEach(function (emp) {
              try {
                var raw = localStorage.getItem('schedule_' + emp.id);
                if (raw) {
                  var d = JSON.parse(raw);
                  if (d.slots) emp.slots = d.slots;
                  if (d.goal) emp.goal = parseFloat(d.goal) || 24;
                }
              } catch (e) { }
            });
            saveAllEmployees();
          } else {
            employees.forEach(function (emp, idx) {
              if (!emp.id) emp.id = 'emp_' + idx;
              if (!emp.slots) emp.slots = makeFreeWeek();
              if (emp.goal === undefined) emp.goal = 24;
              if (!emp.color) emp.color = COLORS[idx % COLORS.length];
            });
          }
        }



        function getDayConflict(emp, dayIdx) {
          var slot = emp.slots[dayIdx];
          var hrs = slotHours(slot);
          if (hrs === 0) return null;
          var sameShift = false;
          var overlap = false;
          for (var j = 0; j < employees.length; j++) {
            var other = employees[j];
            if (other.id === emp.id) continue;
            var oSlot = other.slots[dayIdx];
            var oHrs = slotHours(oSlot);
            if (oHrs > 0) {
              var iA = parseFloat(slot.i), oA = parseFloat(slot.o);
              var iB = parseFloat(oSlot.i), oB = parseFloat(oSlot.o);
              if (iA === iB && oA === oB) sameShift = true;
              else if (iA < oB && oA > iB) overlap = true;
            }
          }
          if (sameShift) return 'same-shift';
          if (overlap) return 'overlap';
          return null;
        }

        function renderCal(emp) {
          var html = DAYS_SHORT.map(function (d) { return '<div class="cal-header">' + d + '</div>'; }).join('');
          html += emp.slots.map(function (slot, i) {
            var hrs = slotHours(slot);
            var libre = hrs === 0;
            var conflict = getDayConflict(emp, i);

            var cls = 'cal-cell';
            if (libre) cls += ' libre';
            else if (conflict === 'same-shift') cls += ' same-shift';
            else if (conflict === 'overlap') cls += ' has-overlap';

            var dot = (conflict === 'same-shift') ? '<div class="same-dot"></div>' : (conflict === 'overlap') ? '<div class="overlap-dot"></div>' : '';

            var inner = libre ? '<span class="libre-label">Libre</span>' :
              '<div class="cal-time-block" style="background: ' + emp.color + ';"><span class="cal-time-in">' + timeLabel(slot.i) + '</span><span class="cal-time-out">' + timeLabel(slot.o) + '</span></div>' +
              '<span class="cal-hrs" style="color: ' + emp.color + ';">' + hrs.toFixed(1) + 'h</span>';

            return '<div class="' + cls + '" data-emp-id="' + emp.id + '" data-day="' + i + '">' + dot + '<span class="cal-day-name">' + DAYS_SHORT[i] + '</span>' + inner + '</div>';
          }).join('');

          var cal = document.getElementById(emp.id + '-cal');
          if (cal) cal.innerHTML = html;
        }

        function refreshEmployee(empId) {
          var emp = findEmployee(empId);
          if (!emp) return;

          var total = emp.slots.reduce(function (a, s) { return a + slotHours(s); }, 0);
          var elTotal = document.getElementById(emp.id + '-hours-total');
          if (elTotal) elTotal.textContent = total.toFixed(1) + ' hrs';

          var pct = Math.min((total / emp.goal) * 100, 100);
          var bar = document.getElementById(emp.id + '-progress');
          if (bar) {
            bar.style.width = pct + '%';
            if (total >= emp.goal) {
              bar.style.background = 'var(--success)';
            } else {
              bar.style.background = emp.color;
            }
          }

          var msg = document.getElementById(emp.id + '-status-msg');
          if (msg) {
            if (total >= emp.goal) {
              bar.classList.add('complete');
              msg.className = 'goal-msg met';
              msg.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>¡Meta de ' + emp.goal + ' hrs cumplida! +' + (total - emp.goal).toFixed(1) + ' extra</span>';
            } else {
              bar.classList.remove('complete');
              msg.className = 'goal-msg';
              msg.innerHTML = '<span class="material-symbols-outlined">info</span><span>Faltan ' + (emp.goal - total).toFixed(1) + ' horas para la meta (' + emp.goal + ' hrs).</span>';
            }
          }
        }

        function renderEmployeeCards() {
          var container = document.getElementById('view-cards');
          if (!container) return;

          var html = employees.map(function (emp) {
            var total = emp.slots.reduce(function (a, s) { return a + slotHours(s); }, 0);
            return '<div class="emp-card" id="card-' + emp.id + '">' +
              '<div class="card-header">' +
              '<div class="card-name-group">' +
              '<div class="avatar" style="background: ' + emp.color + '1a; color: ' + emp.color + ';"><span class="material-symbols-outlined">badge</span></div>' +
              '<div style="display:flex; flex-direction:column;">' +
              '<span class="emp-name">' + esc(emp.name) + '</span>' +
              '<span class="emp-validity">' + getValidityText() + '</span>' +
              '</div>' +
              '</div>' +
              '<div class="card-actions">' +
              '<div class="saved-badge" id="' + emp.id + '-saved">' +
              '<span class="material-symbols-outlined">cloud_done</span> Guardado' +
              '</div>' +
              '<button class="btn-icon btn-reset-emp" data-id="' + emp.id + '" title="Limpiar horario">' +
              '<span class="material-symbols-outlined">delete_sweep</span>' +
              '</button>' +
              '<button class="btn-icon btn-delete-emp" data-id="' + emp.id + '" title="Eliminar empleado">' +
              '<span class="material-symbols-outlined">person_remove</span>' +
              '</button>' +
              '</div>' +
              '</div>' +
              '<div class="goal-row">' +
              '<label for="' + emp.id + '-goal">Meta de horas semanales:</label>' +
              '<input class="goal-input" type="number" id="' + emp.id + '-goal" value="' + emp.goal + '" min="1" max="48" data-id="' + emp.id + '">' +
              '<span class="goal-unit">hrs</span>' +
              '</div>' +
              '<div class="cal-grid" id="' + emp.id + '-cal"></div>' +
              '<div class="card-footer">' +
              '<div class="metrics-row">' +
              '<span class="metric-label">Total semanal</span>' +
              '<span class="metric-value" id="' + emp.id + '-hours-total">' + total.toFixed(1) + ' hrs</span>' +
              '</div>' +
              '<div class="progress-track"><div class="progress-fill" id="' + emp.id + '-progress"></div></div>' +
              '<div class="goal-msg" id="' + emp.id + '-status-msg">' +
              '<span class="material-symbols-outlined">info</span>' +
              '<span>Faltan ' + (emp.goal - total).toFixed(1) + ' horas para la meta.</span>' +
              '</div>' +
              '</div>' +
              '</div>';
          }).join('');

          html += '<div class="emp-card add-emp-card" id="card-add-employee" style="border: 2px dashed var(--border); background: transparent; display: flex; align-items: center; justify-content: center; min-height: 250px; cursor: pointer; transition: all 0.2s; box-shadow: none; align-self: stretch;">' +
            '<div style="text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px;">' +
            '<span class="material-symbols-outlined" style="font-size: 40px; color: var(--accent);">person_add</span>' +
            '<span style="font-weight: 700; font-size: 14px; color: var(--text);">Agregar Empleado</span>' +
            '</div>' +
            '</div>';

          container.innerHTML = html;

          employees.forEach(function (emp) {
            renderCal(emp);
            refreshEmployee(emp.id);
          });
        }

        function checkOverlapAlert() {
          var same = [], over = [];
          for (var i = 0; i < 7; i++) {
            for (var j = 0; j < employees.length; j++) {
              for (var k = j + 1; k < employees.length; k++) {
                var emp1 = employees[j];
                var emp2 = employees[k];
                var slot1 = emp1.slots[i];
                var slot2 = emp2.slots[i];
                var h1 = slotHours(slot1);
                var h2 = slotHours(slot2);
                if (h1 > 0 && h2 > 0) {
                  var i1 = parseFloat(slot1.i), o1 = parseFloat(slot1.o);
                  var i2 = parseFloat(slot2.i), o2 = parseFloat(slot2.o);
                  if (i1 === i2 && o1 === o2) {
                    same.push(emp1.name + ' y ' + emp2.name + ' (' + DAYS_SHORT[i] + ')');
                  } else if (i1 < o2 && o1 > i2) {
                    over.push(emp1.name + ' y ' + emp2.name + ' (' + DAYS_SHORT[i] + ')');
                  }
                }
              }
            }
          }
          var alert = document.getElementById('overlap-alert');
          var text = document.getElementById('overlap-alert-text');
          if (!alert || !text) return;
          var msgs = [];
          if (same.length) msgs.push('Turno idéntico: ' + same.join(', '));
          if (over.length) msgs.push('Solapamiento en: ' + over.join(', '));
          if (msgs.length) {
            alert.classList.add('show');
            text.textContent = msgs.join('  ·  ');
          } else {
            alert.classList.remove('show');
          }
        }

        function renderCompareLegend() {
          var html = employees.map(function (emp, idx) {
            var color = emp.color;
            return '<div class="legend-item"><div class="legend-dot" style="background:' + color + '"></div>' + esc(emp.name) + '</div>';
          }).join('');

          html += '<div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Solapamiento</div>';
          html += '<div class="legend-item"><div class="legend-dot" style="background:#dc2626"></div>Turno idéntico</div>';
          html += '<div class="legend-item"><div class="legend-dot" style="background:#1d7a4c"></div>Todos libres</div>';

          var legend = document.querySelector('.cmp-legend');
          if (legend) legend.innerHTML = html;
        }

        function refreshCompare() {
          var html = DAYS_SHORT.map(function (d) { return '<div class="cmp-col-label">' + d + '</div>'; }).join('');

          html += DAYS.map(function (_, i) {
            var workingEmps = [];
            employees.forEach(function (emp) {
              var slot = emp.slots[i];
              var hrs = slotHours(slot);
              if (hrs > 0) {
                workingEmps.push({ emp: emp, slot: slot });
              }
            });

            var cellCls = 'cmp-cell';
            var badge = '';

            if (workingEmps.length === 0) {
              cellCls += ' both-libre';
              badge = '<span class="cmp-badge badge-free">Todos libres</span>';
            } else if (workingEmps.length > 1) {
              var sameCount = 0;
              var overlapCount = 0;
              var totalPairs = 0;

              for (var j = 0; j < workingEmps.length; j++) {
                for (var k = j + 1; k < workingEmps.length; k++) {
                  totalPairs++;
                  var s1 = workingEmps[j].slot;
                  var s2 = workingEmps[k].slot;
                  var i1 = parseFloat(s1.i), o1 = parseFloat(s1.o);
                  var i2 = parseFloat(s2.i), o2 = parseFloat(s2.o);
                  if (i1 === i2 && o1 === o2) sameCount++;
                  else if (i1 < o2 && o1 > i2) overlapCount++;
                }
              }

              if (sameCount === totalPairs) {
                cellCls += ' both';
                badge = '<span class="cmp-badge badge-same">¡Iguales!</span>';
              } else if (overlapCount > 0 || sameCount > 0) {
                cellCls += ' both';
                badge = '<span class="cmp-badge badge-overlap">Solapan</span>';
              } else {
                cellCls += ' only-m';
              }
            } else {
              cellCls += ' only-m';
            }

            var blocksHtml = employees.map(function (emp) {
              var slot = emp.slots[i];
              var hrs = slotHours(slot);
              var color = emp.color;
              if (hrs === 0) {
                return '<div class="cmp-emp-block libre-block" style="border-left: 3px solid ' + color + ';"><span class="cmp-emp-name" style="color:' + color + ';">' + esc(emp.name) + '</span><span class="cmp-emp-time">Libre</span></div>';
              } else {
                return '<div class="cmp-emp-block" style="background:' + color + '; color:#fff;"><span class="cmp-emp-name" style="opacity: 0.9;">' + esc(emp.name) + '</span><span class="cmp-emp-time">' + timeLabel(slot.i) + '–' + timeLabel(slot.o) + '</span></div>';
              }
            }).join('');

            return '<div class="' + cellCls + '">' + blocksHtml + badge + '</div>';
          }).join('');

          var grid = document.getElementById('compare-grid');
          if (grid) grid.innerHTML = html;
        }

        function switchView(v) {
          var tS = document.getElementById('tab-schedules');
          var tC = document.getElementById('tab-compare');
          var vC = document.getElementById('view-cards');
          var vComp = document.getElementById('view-compare');

          if (tS) tS.classList.toggle('active', v === 'schedules');
          if (tC) tC.classList.toggle('active', v === 'compare');
          if (vC) vC.style.display = v === 'schedules' ? '' : 'none';
          if (vComp) vComp.style.display = v === 'compare' ? '' : 'none';

          var btnImg = document.getElementById('btn-export-img');
          var btnPdf = document.getElementById('btn-export-pdf');
          if (btnImg) btnImg.disabled = (v === 'compare');
          if (btnPdf) btnPdf.disabled = (v === 'compare');

          if (v === 'compare') {
            refreshCompare();
            renderCompareLegend();
          }
        }

        function saveToStorage(empId) {
          saveAllEmployees();
          var savedEl = document.getElementById(empId + '-saved');
          if (savedEl) {
            savedEl.classList.add('visible');
            setTimeout(function () {
              savedEl.classList.remove('visible');
            }, 3000);
          }
        }

        function resetEmployee(empId) {
          var emp = findEmployee(empId);
          if (!emp) return;
          emp.slots = makeFreeWeek();
          renderCal(emp);
          refreshEmployee(empId);

          employees.forEach(function (e) {
            renderCal(e);
            refreshEmployee(e.id);
          });
          saveAllEmployees();
          checkOverlapAlert();
          showToast('Horario de ' + emp.name + ' limpiado');
        }

        function addEmployee(name, goal) {
          var id = nextEmpId();
          var color = COLORS[employees.length % COLORS.length];
          employees.push({
            id: id,
            name: name,
            goal: goal,
            slots: makeFreeWeek(),
            color: color
          });
          saveAllEmployees();
          renderEmployeeCards();
          checkOverlapAlert();
          showToast('Empleado "' + name + '" agregado');
        }

        function deleteEmployee(empId) {
          var emp = findEmployee(empId);
          if (!emp) return;
          employees = employees.filter(function (e) { return e.id !== empId; });
          saveAllEmployees();
          renderEmployeeCards();
          checkOverlapAlert();
          showToast('Empleado "' + emp.name + '" eliminado');
        }

        var modalCtx = { empId: null, day: null };
        function openModal(empId, dayIdx) {
          var emp = findEmployee(empId);
          if (!emp) return;
          modalCtx = { empId: empId, day: dayIdx };
          var slot = emp.slots[dayIdx];
          document.getElementById('modal-day-label').textContent = DAYS[dayIdx] + ' — ' + emp.name;
          document.getElementById('modal-in').innerHTML = buildTimeOpts(slot.i);
          document.getElementById('modal-out').innerHTML = buildTimeOpts(slot.o);
          document.getElementById('modal-bg').classList.add('open');
        }
        function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

        function confirmModal() {
          var inV = document.getElementById('modal-in').value;
          var outV = document.getElementById('modal-out').value;
          var emp = findEmployee(modalCtx.empId);
          if (emp) {
            emp.slots[modalCtx.day] = { i: inV, o: outV };
          }
          closeModal();

          employees.forEach(function (e) {
            renderCal(e);
            refreshEmployee(e.id);
          });
          saveAllEmployees();
          checkOverlapAlert();
        }

        function openAddEmployeeModal() {
          document.getElementById('new-emp-name').value = '';
          document.getElementById('new-emp-goal').value = '24';
          document.getElementById('modal-add-emp-bg').classList.add('open');
          document.getElementById('new-emp-name').focus();
        }
        function closeAddEmployeeModal() {
          document.getElementById('modal-add-emp-bg').classList.remove('open');
        }
        function confirmAddEmployee() {
          var name = document.getElementById('new-emp-name').value.trim();
          var goal = parseFloat(document.getElementById('new-emp-goal').value) || 24;
          if (!name) {
            showToast('Escribe el nombre del empleado');
            return;
          }
          addEmployee(name, goal);
          closeAddEmployeeModal();
        }

        function exportSchedules() {
          if (typeof html2canvas === 'undefined') {
            showToast('Librería procesando, intenta en 1 seg.');
            return;
          }
          var cards = document.querySelectorAll('#view-cards .emp-card:not(.add-emp-card)');
          if (cards.length === 0) {
            showToast('No hay empleados para exportar.');
            return;
          }

          var index = 0;
          function captureNext() {
            if (index >= cards.length) {
              showToast('Imágenes exportadas');
              return;
            }

            var card = cards[index];
            var name = card.querySelector('.emp-name').textContent.trim();
            showToast('Generando imagen de ' + name + '...');

            html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(function (canvas) {
              var a = document.createElement('a');
              a.download = 'Horario_' + name.replace(/\s+/g, '_') + '.png';
              a.href = canvas.toDataURL('image/png');
              a.click();
              index++;
              setTimeout(captureNext, 200);
            }).catch(function () {
              showToast('Error al exportar imagen de ' + name);
              index++;
              setTimeout(captureNext, 200);
            });
          }

          captureNext();
        }

        function exportPDF() {
          if (typeof window.jspdf === 'undefined') {
            showToast('Librería PDF no cargada.');
            return;
          }
          var cards = document.querySelectorAll('#view-cards .emp-card:not(.add-emp-card)');
          if (cards.length === 0) {
            showToast('No hay empleados para exportar.');
            return;
          }

          showToast('Generando PDF...');

          var jsPDF = window.jspdf.jsPDF;
          var pdf = new jsPDF('l', 'mm', 'a4');
          var pageWidth = pdf.internal.pageSize.getWidth();
          var pageHeight = pdf.internal.pageSize.getHeight();
          var margin = 12; // mm
          var maxW = pageWidth - (margin * 2);
          var maxH = pageHeight - (margin * 2);

          var index = 0;
          function captureNext() {
            if (index >= cards.length) {
              pdf.save('Horarios_Empleados.pdf');
              showToast('PDF exportado');
              return;
            }

            var card = cards[index];
            html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(function (canvas) {
              var imgData = canvas.toDataURL('image/png');
              var imgWidth = canvas.width;
              var imgHeight = canvas.height;
              var ratio = imgWidth / imgHeight;

              var w = maxW;
              var h = maxW / ratio;
              if (h > maxH) {
                h = maxH;
                w = maxH * ratio;
              }

              var x = (pageWidth - w) / 2;
              var y = (pageHeight - h) / 2;

              if (index > 0) {
                pdf.addPage();
              }
              pdf.addImage(imgData, 'PNG', x, y, w, h);
              index++;
              captureNext();
            }).catch(function () {
              showToast('Error en página ' + (index + 1));
            });
          }

          captureNext();
        }

        // Event delegation on view-cards
        var viewCards = document.getElementById('view-cards');
        if (viewCards) {
          viewCards.addEventListener('click', function (e) {
            var cell = e.target.closest('[data-day]');
            if (cell) {
              var empId = cell.getAttribute('data-emp-id');
              var day = parseInt(cell.getAttribute('data-day'), 10);
              openModal(empId, day);
              return;
            }
            var resetBtn = e.target.closest('.btn-reset-emp');
            if (resetBtn) {
              resetEmployee(resetBtn.getAttribute('data-id'));
              return;
            }
            var deleteBtn = e.target.closest('.btn-delete-emp');
            if (deleteBtn) {
              var empId = deleteBtn.getAttribute('data-id');
              var emp = findEmployee(empId);
              if (emp && confirm('¿Estás seguro de que deseas eliminar a ' + emp.name + '?')) {
                deleteEmployee(empId);
              }
              return;
            }
            var addCard = e.target.closest('#card-add-employee');
            if (addCard) {
              openAddEmployeeModal();
              return;
            }
          });

          viewCards.addEventListener('change', function (e) {
            var input = e.target.closest('.goal-input');
            if (input) {
              var empId = input.getAttribute('data-id');
              var val = parseFloat(input.value) || 24;
              var emp = findEmployee(empId);
              if (emp) {
                emp.goal = val;
                saveAllEmployees();
                refreshEmployee(empId);
                checkOverlapAlert();
              }
            }
          });
        }

        var addEv = function (id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
        addEv('tab-schedules', 'click', function () { switchView('schedules'); });
        addEv('tab-compare', 'click', function () { switchView('compare'); });
        addEv('btn-export-img', 'click', exportSchedules);
        addEv('btn-export-pdf', 'click', exportPDF);
        addEv('start-date', 'change', function () {
          saveValidityDates();
          updateValidityDisplay();
        });
        addEv('end-date', 'change', function () {
          saveValidityDates();
          updateValidityDisplay();
        });
        addEv('btn-modal-cancel', 'click', closeModal);
        addEv('btn-modal-ok', 'click', confirmModal);
        addEv('modal-bg', 'click', function (e) { if (e.target === document.getElementById('modal-bg')) closeModal(); });
        addEv('btn-add-emp-cancel', 'click', closeAddEmployeeModal);
        addEv('btn-add-emp-ok', 'click', confirmAddEmployee);
        addEv('modal-add-emp-bg', 'click', function (e) { if (e.target === document.getElementById('modal-add-emp-bg')) closeAddEmployeeModal(); });
        addEv('new-emp-name', 'keypress', function (e) { if (e.key === 'Enter') confirmAddEmployee(); });
        addEv('new-emp-goal', 'keypress', function (e) { if (e.key === 'Enter') confirmAddEmployee(); });

        var toastTimer;
        function showToast(msg) {
          var t = document.getElementById('toast');
          var txt = document.getElementById('toast-text');
          if (!t || !txt) return;
          txt.textContent = msg;
          t.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
        }

        // Init
        loadAllEmployees();
        loadValidityDates();
        renderEmployeeCards();
        checkOverlapAlert();
      }

      // Verificar si el documento ya cargó o si debemos esperar
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initControlHorarios);
      } else {
        initControlHorarios();
      }
    })();
  </script>
</body>

</html>
