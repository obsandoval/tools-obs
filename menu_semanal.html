<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Semanal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%230e0e0f'/><path fill='%2386efac' d='M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGIS()"></script>
  <link rel="stylesheet" href="css/menu_semanal.css">
  <style>
    .drive-btn {
      position: absolute; top: 40px; right: 24px;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); background: transparent;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: var(--transition);
    }
    .drive-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .drive-menu {
      position: fixed; right: 14px; background: #1a1a1b;
      border: 1px solid #333; border-radius: 10px; padding: 6px; z-index: 200;
    }
    .drive-menu-item {
      padding: 10px 14px; cursor: pointer; display: flex; align-items: center;
      gap: 8px; font-size: 14px; border-radius: 6px; color: inherit;
    }
    .drive-menu-item:hover { background: #2a2a2b; }
    .drive-menu-item.danger { color: #ef4444; }
    .hidden { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin .9s linear infinite; display: inline-block; }
    .drive-ok    { color: #22c55e !important; }
    .drive-error { color: #ef4444 !important; }
    .drive-syncing { color: #9ca3af !important; }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="back-link" aria-label="Volver al inicio">
      <span class="material-icons-round">arrow_back</span>
    </a>
    <h1>Menú Semanal</h1>
    <button class="drive-btn" id="driveBtn" title="Google Drive Sync" onclick="connectDrive()">
      <span class="material-icons-round">cloud_off</span>
    </button>
  </header>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="generateRandom()">
      <span class="material-icons-round">shuffle</span>
      Aleatorio
    </button>
    <button class="btn btn-outline" onclick="openSearchModal()">
      <span class="material-icons-round">search</span>
      Buscar
    </button>
    <button class="btn btn-outline" onclick="copyToClipboard()">
      <span class="material-icons-round">content_copy</span>
      TXT
    </button>
    <button class="btn btn-secondary" onclick="exportPDF()">
      <span class="material-icons-round">picture_as_pdf</span>
      PDF
    </button>
  </div>

  <div class="week-grid" id="weekGrid"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal">
      <h3 id="modalTitle">Cambiar platillo</h3>
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar platillo..."
        oninput="filterOptions()">
      <div class="filter-row" id="filterRow">
        <button class="filter-btn active" onclick="setFilter('Todos', this)">Todos</button>
        <button class="filter-btn" onclick="setFilter('Desayuno', this)">Desayuno</button>
        <button class="filter-btn" onclick="setFilter('Almuerzo', this)">Almuerzo</button>
        <button class="filter-btn" onclick="setFilter('Snack', this)">Snack</button>
      </div>
      <div class="options-list" id="optionsList"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ════════════════════════════════════════
    // GOOGLE DRIVE SYNC
    // ════════════════════════════════════════
    const DRIVE_CLIENT_ID = '331021142047-3qofp3l7m9j68ogoqj1sr7a30fd081gl.apps.googleusercontent.com';
    const DRIVE_SCOPE     = 'https://www.googleapis.com/auth/drive.appdata';
    const DRIVE_FILE_NAME = 'menu-semanal-data.json';
    const DRIVE_BASE      = 'https://www.googleapis.com/drive/v3';
    const DRIVE_UPLOAD    = 'https://www.googleapis.com/upload/drive/v3';

    let driveToken  = null;
    let driveFileId = null;
    let tokenClient = null;

    window.initGIS = function () {
      if (typeof google === 'undefined') return;
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: DRIVE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: async (resp) => {
          if (resp.error) { setDriveStatus('error'); return; }
          driveToken = resp.access_token;
          localStorage.setItem('drive_token',  driveToken);
          localStorage.setItem('drive_expiry', Date.now() + 3500 * 1000);
          await syncWithDrive();
        }
      });
      const token  = localStorage.getItem('drive_token');
      const expiry = parseInt(localStorage.getItem('drive_expiry') || '0');
      if (token && Date.now() < expiry) { driveToken = token; }
    };

    function connectDrive() {
      if (!tokenClient) { showToast('Cargando Google Sign-In…'); return; }
      if (driveToken) { showDriveMenu(); return; }
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    function disconnectDrive() {
      google.accounts.oauth2.revoke(driveToken, () => {});
      driveToken = null; driveFileId = null;
      ['drive_token','drive_expiry','drive_file_id_menu'].forEach(k => localStorage.removeItem(k));
      setDriveStatus('off');
      showToast('Desconectado de Google Drive');
    }

    async function syncWithDrive() {
      if (!driveToken) return;
      setDriveStatus('syncing');
      try {
        driveFileId = await findOrCreateFile();
        const remote = await readDriveFile(driveFileId);
        if (remote && remote.weekMenu && remote.weekMenu.length) {
          weekMenu = remote.weekMenu;
          renderWeek();
        } else {
          if (!weekMenu.length) generateRandom();
          await writeDriveFile(driveFileId);
        }
        setDriveStatus('ok');
        showToast('Drive sincronizado ✓');
      } catch (e) {
        console.error(e);
        setDriveStatus(e.status === 401 ? 'off' : 'error');
        if (e.status === 401) { driveToken = null; localStorage.removeItem('drive_token'); }
      }
    }

    async function drivePersist() {
      if (!driveToken || !driveFileId) return;
      try {
        await writeDriveFile(driveFileId);
        setDriveStatus('ok');
      } catch (e) {
        if (e.status === 401) { driveToken = null; setDriveStatus('off'); }
        else setDriveStatus('error');
      }
    }

    async function findOrCreateFile() {
      const cached = localStorage.getItem('drive_file_id_menu');
      if (cached) return cached;
      const res = await driveReq(`${DRIVE_BASE}/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILE_NAME}%27&fields=files(id)`);
      if (res.files && res.files.length) {
        localStorage.setItem('drive_file_id_menu', res.files[0].id);
        return res.files[0].id;
      }
      const created = await driveReq(`${DRIVE_BASE}/files`, {
        method: 'POST',
        body: JSON.stringify({ name: DRIVE_FILE_NAME, parents: ['appDataFolder'] })
      });
      localStorage.setItem('drive_file_id_menu', created.id);
      return created.id;
    }

    async function readDriveFile(id) {
      try { return await driveReq(`${DRIVE_BASE}/files/${id}?alt=media`); }
      catch { return null; }
    }

    async function writeDriveFile(id) {
      await driveReq(`${DRIVE_UPLOAD}/files/${id}?uploadType=media`, {
        method: 'PATCH',
        body: JSON.stringify({ weekMenu, updatedAt: new Date().toISOString() })
      });
    }

    async function driveReq(url, opts = {}) {
      const res = await fetch(url, {
        method: opts.method || 'GET',
        headers: { 'Authorization': `Bearer ${driveToken}`, 'Content-Type': 'application/json' },
        body: opts.body
      });
      if (!res.ok) { const e = new Error(res.status); e.status = res.status; throw e; }
      const txt = await res.text();
      return txt ? JSON.parse(txt) : null;
    }

    function setDriveStatus(status) {
      const btn = document.getElementById('driveBtn');
      if (!btn) return;
      const icon = btn.querySelector('.material-icons-round');
      icon.className = 'material-icons-round';
      const map = {
        off:     { ic: 'cloud_off',  cls: '' },
        syncing: { ic: 'cloud_sync', cls: 'spinning drive-syncing' },
        ok:      { ic: 'cloud_done', cls: 'drive-ok' },
        error:   { ic: 'cloud_off',  cls: 'drive-error' }
      };
      const s = map[status] || map.off;
      icon.textContent = s.ic;
      if (s.cls) icon.classList.add(...s.cls.split(' '));
    }

    function showDriveMenu() {
      let menu = document.getElementById('driveMenu');
      if (!menu) {
        menu = document.createElement('div');
        menu.id = 'driveMenu';
        menu.className = 'drive-menu hidden';
        menu.innerHTML = `
          <div class="drive-menu-item" onclick="syncWithDrive();document.getElementById('driveMenu').classList.add('hidden')">
            <span class="material-icons-round" style="font-size:17px">sync</span>Sincronizar ahora
          </div>
          <div class="drive-menu-item danger" onclick="disconnectDrive();document.getElementById('driveMenu').classList.add('hidden')">
            <span class="material-icons-round" style="font-size:17px">link_off</span>Desconectar
          </div>`;
        document.body.appendChild(menu);
      }
      const rect = document.getElementById('driveBtn').getBoundingClientRect();
      menu.style.top = (rect.bottom + 6) + 'px';
      menu.classList.remove('hidden');
      setTimeout(() => document.addEventListener('click', () => menu.classList.add('hidden'), { once: true }), 0);
    }

    // ════════════════════════════════════════

    const DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
    const MEAL_TYPES = ['Desayuno', 'Almuerzo'];

    let dishes = [];
    const byType = t => dishes.filter(d => d.type === t);

    // State: weekMenu[dayIndex][mealType] = dish
    let weekMenu = [];

    function randFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateRandom() {
      weekMenu = DAYS.map(() => {
        const m = {};
        MEAL_TYPES.forEach(t => { m[t] = randFrom(byType(t)); });
        // Randomly add a snack sometimes
        const snacks = byType('Snack');
        if (Math.random() > 0.45) m['Snack'] = randFrom(snacks);
        return m;
      });
      renderWeek();
      drivePersist();
    }

    function renderWeek() {
      const grid = document.getElementById('weekGrid');
      grid.innerHTML = '';
      DAYS.forEach((day, di) => {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.style.animationDelay = `${di * 0.05}s`;

        const header = `<div class="day-header">
      <span class="day-name">${day}</span>
    </div>`;

        const meals = weekMenu[di];
        const mealsHTML = Object.entries(meals).map(([type, dish]) => `
      <div class="meal-row" id="meal-${di}-${type}">
        <span class="meal-type-badge badge-${type.toLowerCase()}">${typeIcon(type)} ${type}</span>
        <span class="meal-name">${dish.name}</span>
        ${dish.extras ? `<span class="meal-extras">+ ${dish.extras}</span>` : ''}
        <div class="meal-actions">
          <button class="meal-btn" onclick="openModal(${di}, '${type}')">
            <span class="material-icons-round" style="font-size: 12px;">edit</span>
            Cambiar
          </button>
          <button class="meal-btn" onclick="shuffleOne(${di}, '${type}')">
            <span class="material-icons-round" style="font-size: 12px;">shuffle</span>
            Aleatorio
          </button>
        </div>
      </div>`).join('');

        card.innerHTML = header + `<div class="meals-list">${mealsHTML}</div>`;
        grid.appendChild(card);
      });
    }

    function typeIcon(t) {
      if (t === 'Desayuno') return '<span class="material-icons-round">wb_sunny</span>';
      if (t === 'Almuerzo') return '<span class="material-icons-round">restaurant</span>';
      return '<span class="material-icons-round">local_bar</span>';
    }

    function shuffleOne(di, type) {
      const pool = byType(type);
      weekMenu[di][type] = randFrom(pool);
      renderWeek();
      showToast('¡Platillo cambiado!');
      drivePersist();
    }

    // Modal
    let editTarget = null;
    let currentFilter = 'Todos';

    function openModal(di, type) {
      editTarget = { di, type };
      document.getElementById('modalTitle').textContent = `Cambiar ${type} del ${DAYS[di]}`;
      document.getElementById('searchInput').value = '';
      setFilter(type === 'Snack' ? 'Snack' : type, null, true);
      document.getElementById('modalOverlay').classList.add('open');
    }

    function openSearchModal() {
      editTarget = 'copy_mode';
      document.getElementById('modalTitle').textContent = 'Buscar y copiar platillo';
      document.getElementById('searchInput').value = '';
      setFilter('Todos', null, false);
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      editTarget = null;
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    function setFilter(f, btn, skipRender) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) { btn.classList.add('active'); }
      else {
        document.querySelectorAll('.filter-btn').forEach(b => {
          if (b.textContent === f) b.classList.add('active');
        });
      }
      if (!skipRender) filterOptions();
      else buildOptions(dishes);
    }

    function filterOptions() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      let pool = currentFilter === 'Todos' ? dishes : dishes.filter(d => d.type === currentFilter);
      if (q) pool = pool.filter(d => d.name.toLowerCase().includes(q));
      buildOptions(pool);
    }

    function buildOptions(pool) {
      const list = document.getElementById('optionsList');
      if (!pool.length) {
        list.innerHTML = `<p style="color:var(--sage);font-size:13px;text-align:center;padding:20px">No se encontraron platillos</p>`;
        return;
      }
      list.innerHTML = pool.map(d => `
    <div class="option-item" onclick="selectDish('${escStr(d.name)}')">
      <span class="option-name">${d.name}</span>
      <span class="option-meta">${d.type} · ${diffDots(d.difficulty)} ${d.difficulty}${d.extras ? ' · + ' + d.extras : ''}</span>
    </div>`).join('');
    }

    function escStr(s) { return s.replace(/'/g, "\\'"); }

    function diffDots(d) {
      const cls = { 'Baja': 'diff-baja', 'Media': 'diff-media', 'Alta': 'diff-alta' };
      return `<span class="diff-dot ${cls[d] || ''}"></span>`;
    }

    function selectDish(name) {
      const dish = dishes.find(d => d.name === name);
      if (!dish) return;
      if (editTarget === 'copy_mode') {
        navigator.clipboard.writeText(dish.name).then(() => {
          showToast(`✓ Copiado: ${dish.name}`);
        });
        return;
      }
      if (!editTarget) return;
      weekMenu[editTarget.di][editTarget.type] = dish;
      renderWeek();
      showToast(`"${dish.name}" seleccionado`);
      closeModal();
      drivePersist();
    }

    // Clipboard
    function copyToClipboard() {
      if (!weekMenu.length) { showToast('Primero genera un menú'); return; }
      let text = '';
      DAYS.forEach((day, di) => {
        text += `${day.toUpperCase()}\n`;
        Object.entries(weekMenu[di]).forEach(([type, dish]) => {
          text += `${dish.name}\n`;
        });
        text += '\n';
      });
      navigator.clipboard.writeText(text.trim()).then(() => showToast('✓ Copiado al portapapeles'));
    }

    // PDF
    function exportPDF() {
      if (!weekMenu.length) { showToast('Primero genera un menú'); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

      const W = 210, M = 18;
      const colW = (W - M * 2 - 8) / 2;
      let x = M, y = M;

      // Background
      doc.setFillColor(250, 246, 239);
      doc.rect(0, 0, W, 297, 'F');

      // Header bar
      doc.setFillColor(61, 43, 31);
      doc.rect(0, 0, W, 28, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(7);
      doc.setFont('helvetica', 'normal');
      doc.text('PLANIFICACIÓN', W / 2, 10, { align: 'center' });
      doc.setFontSize(18);
      doc.setFont('helvetica', 'bold');
      doc.text('MENÚ SEMANAL', W / 2, 20, { align: 'center' });

      // Accent line
      doc.setFillColor(196, 98, 45);
      doc.rect(M, 30, W - M * 2, 1.2, 'F');

      y = 38;

      const typeColors = {
        'Desayuno': [255, 243, 224],
        'Almuerzo': [232, 244, 234],
        'Snack': [252, 232, 243]
      };
      const typeText = {
        'Desayuno': [224, 123, 57],
        'Almuerzo': [74, 140, 86],
        'Snack': [181, 84, 138]
      };

      DAYS.forEach((day, di) => {
        const meals = Object.entries(weekMenu[di]);
        const mealH = meals.length * 12 + 14;

        const col = di % 2;
        const xPos = M + col * (colW + 8);
        if (col === 0 && di > 0) { y += mealH + 6; }

        // Check new page
        if (y + mealH > 280) { doc.addPage(); y = 18; doc.setFillColor(250, 246, 239); doc.rect(0, 0, W, 297, 'F'); }

        // Card bg
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(xPos, y, colW, mealH, 3, 3, 'F');
        doc.setDrawColor(214, 201, 180);
        doc.setLineWidth(0.4);
        doc.roundedRect(xPos, y, colW, mealH, 3, 3, 'S');

        // Day header
        doc.setFillColor(61, 43, 31);
        doc.roundedRect(xPos, y, colW, 10, 3, 3, 'F');
        doc.rect(xPos, y + 5, colW, 5, 'F');

        doc.setTextColor(255, 255, 255);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'bold');
        doc.text(day.toUpperCase(), xPos + 6, y + 7);

        let ry = y + 13;
        meals.forEach(([type, dish]) => {
          // Badge bg
          const bc = typeColors[type] || [240, 240, 240];
          const tc = typeText[type] || [100, 100, 100];
          doc.setFillColor(...bc);
          doc.roundedRect(xPos + 4, ry - 3, 18, 5, 1.5, 1.5, 'F');
          doc.setTextColor(...tc);
          doc.setFontSize(5.5);
          doc.setFont('helvetica', 'bold');
          doc.text(type.toUpperCase(), xPos + 13, ry + 0.5, { align: 'center' });

          doc.setTextColor(61, 43, 31);
          doc.setFontSize(7.5);
          doc.setFont('helvetica', 'bold');
          const nameLines = doc.splitTextToSize(dish.name, colW - 30);
          doc.text(nameLines, xPos + 25, ry + 0.5);

          if (dish.extras) {
            const eLine = `+ ${dish.extras}`;
            doc.setTextColor(107, 124, 92);
            doc.setFontSize(6);
            doc.setFont('helvetica', 'italic');
            doc.text(doc.splitTextToSize(eLine, colW - 10), xPos + 6, ry + 6);
            ry += 12;
          } else {
            ry += 10;
          }
        });

        if (col === 1 || di === DAYS.length - 1) {
          const leftH = di % 2 === 0 ? mealH : null;
          // if last column advance y
        }
      });

      // Footer
      doc.setFillColor(61, 43, 31);
      doc.rect(0, 287, W, 10, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(6);
      doc.setFont('helvetica', 'normal');
      doc.text('Menú Semanal — Generado automáticamente', W / 2, 293, { align: 'center' });

      doc.save('menu_semanal.pdf');
      showToast('✓ PDF descargado');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Cargar platillos y generar menú al inicio
    fetch('platillos.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('No se pudo cargar el archivo platillos.json');
        }
        return response.json();
      })
      .then(data => {
        dishes = data;
        if (driveToken) {
          syncWithDrive();
        } else {
          generateRandom();
        }
      })
      .catch(error => {
        console.error('Error al cargar los platillos:', error);
        showToast('Error al cargar platillos');
        if (window.location.protocol === 'file:') {
          console.warn('Nota: Los navegadores bloquean peticiones fetch() locales por seguridad usando el protocolo file://. Se recomienda usar un servidor web local.');
        }
      });

  </script>
</body>

</html>
