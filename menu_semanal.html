<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Semanal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="css/menu_semanal.css">
</head>

<body>

  <header>
    <a href="index.html" class="back-link" aria-label="Volver al inicio">
      <span class="material-icons-round">arrow_back</span>
    </a>
    <h1>Menú Semanal</h1>
  </header>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="generateRandom()">
      <span class="material-icons-round">shuffle</span>
      Aleatorio
    </button>
    <button class="btn btn-outline" onclick="openSearchModal()">
      <span class="material-icons-round">search</span>
      Buscar
    </button>
    <button class="btn btn-outline" onclick="copyToClipboard()">
      <span class="material-icons-round">content_copy</span>
      TXT
    </button>
    <button class="btn btn-secondary" onclick="exportPDF()">
      <span class="material-icons-round">picture_as_pdf</span>
      PDF
    </button>
  </div>

  <div class="week-grid" id="weekGrid"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal">
      <h3 id="modalTitle">Cambiar platillo</h3>
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar platillo..."
        oninput="filterOptions()">
      <div class="filter-row" id="filterRow">
        <button class="filter-btn active" onclick="setFilter('Todos', this)">Todos</button>
        <button class="filter-btn" onclick="setFilter('Desayuno', this)">Desayuno</button>
        <button class="filter-btn" onclick="setFilter('Almuerzo', this)">Almuerzo</button>
        <button class="filter-btn" onclick="setFilter('Snack', this)">Snack</button>
      </div>
      <div class="options-list" id="optionsList"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
    const MEAL_TYPES = ['Desayuno', 'Almuerzo'];

    let dishes = [];
    const byType = t => dishes.filter(d => d.type === t);

    // State: weekMenu[dayIndex][mealType] = dish
    let weekMenu = [];

    function randFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateRandom() {
      weekMenu = DAYS.map(() => {
        const m = {};
        MEAL_TYPES.forEach(t => { m[t] = randFrom(byType(t)); });
        // Randomly add a snack sometimes
        const snacks = byType('Snack');
        if (Math.random() > 0.45) m['Snack'] = randFrom(snacks);
        return m;
      });
      renderWeek();
    }

    function renderWeek() {
      const grid = document.getElementById('weekGrid');
      grid.innerHTML = '';
      DAYS.forEach((day, di) => {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.style.animationDelay = `${di * 0.05}s`;

        const header = `<div class="day-header">
      <span class="day-name">${day}</span>
    </div>`;

        const meals = weekMenu[di];
        const mealsHTML = Object.entries(meals).map(([type, dish]) => `
      <div class="meal-row" id="meal-${di}-${type}">
        <span class="meal-type-badge badge-${type.toLowerCase()}">${typeIcon(type)} ${type}</span>
        <span class="meal-name">${dish.name}</span>
        ${dish.extras ? `<span class="meal-extras">+ ${dish.extras}</span>` : ''}
        <div class="meal-actions">
          <button class="meal-btn" onclick="openModal(${di}, '${type}')">
            <span class="material-icons-round" style="font-size: 12px;">edit</span>
            Cambiar
          </button>
          <button class="meal-btn" onclick="shuffleOne(${di}, '${type}')">
            <span class="material-icons-round" style="font-size: 12px;">shuffle</span>
            Aleatorio
          </button>
        </div>
      </div>`).join('');

        card.innerHTML = header + `<div class="meals-list">${mealsHTML}</div>`;
        grid.appendChild(card);
      });
    }

    function typeIcon(t) {
      if (t === 'Desayuno') return '<span class="material-icons-round">wb_sunny</span>';
      if (t === 'Almuerzo') return '<span class="material-icons-round">restaurant</span>';
      return '<span class="material-icons-round">local_bar</span>';
    }

    function shuffleOne(di, type) {
      const pool = byType(type);
      weekMenu[di][type] = randFrom(pool);
      renderWeek();
      showToast('¡Platillo cambiado!');
    }

    // Modal
    let editTarget = null;
    let currentFilter = 'Todos';

    function openModal(di, type) {
      editTarget = { di, type };
      document.getElementById('modalTitle').textContent = `Cambiar ${type} del ${DAYS[di]}`;
      document.getElementById('searchInput').value = '';
      setFilter(type === 'Snack' ? 'Snack' : type, null, true);
      document.getElementById('modalOverlay').classList.add('open');
    }

    function openSearchModal() {
      editTarget = 'copy_mode';
      document.getElementById('modalTitle').textContent = 'Buscar y copiar platillo';
      document.getElementById('searchInput').value = '';
      setFilter('Todos', null, false);
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      editTarget = null;
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    function setFilter(f, btn, skipRender) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) { btn.classList.add('active'); }
      else {
        document.querySelectorAll('.filter-btn').forEach(b => {
          if (b.textContent === f) b.classList.add('active');
        });
      }
      if (!skipRender) filterOptions();
      else buildOptions(dishes);
    }

    function filterOptions() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      let pool = currentFilter === 'Todos' ? dishes : dishes.filter(d => d.type === currentFilter);
      if (q) pool = pool.filter(d => d.name.toLowerCase().includes(q));
      buildOptions(pool);
    }

    function buildOptions(pool) {
      const list = document.getElementById('optionsList');
      if (!pool.length) {
        list.innerHTML = `<p style="color:var(--sage);font-size:13px;text-align:center;padding:20px">No se encontraron platillos</p>`;
        return;
      }
      list.innerHTML = pool.map(d => `
    <div class="option-item" onclick="selectDish('${escStr(d.name)}')">
      <span class="option-name">${d.name}</span>
      <span class="option-meta">${d.type} · ${diffDots(d.difficulty)} ${d.difficulty}${d.extras ? ' · + ' + d.extras : ''}</span>
    </div>`).join('');
    }

    function escStr(s) { return s.replace(/'/g, "\\'"); }

    function diffDots(d) {
      const cls = { 'Baja': 'diff-baja', 'Media': 'diff-media', 'Alta': 'diff-alta' };
      return `<span class="diff-dot ${cls[d] || ''}"></span>`;
    }

    function selectDish(name) {
      const dish = dishes.find(d => d.name === name);
      if (!dish) return;
      if (editTarget === 'copy_mode') {
        navigator.clipboard.writeText(dish.name).then(() => {
          showToast(`✓ Copiado: ${dish.name}`);
        });
        return;
      }
      if (!editTarget) return;
      weekMenu[editTarget.di][editTarget.type] = dish;
      renderWeek();
      showToast(`"${dish.name}" seleccionado`);
      closeModal();
    }

    // Clipboard
    function copyToClipboard() {
      if (!weekMenu.length) { showToast('Primero genera un menú'); return; }
      let text = '';
      DAYS.forEach((day, di) => {
        text += `${day.toUpperCase()}\n`;
        Object.entries(weekMenu[di]).forEach(([type, dish]) => {
          text += `${dish.name}\n`;
        });
        text += '\n';
      });
      navigator.clipboard.writeText(text.trim()).then(() => showToast('✓ Copiado al portapapeles'));
    }

    // PDF
    function exportPDF() {
      if (!weekMenu.length) { showToast('Primero genera un menú'); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

      const W = 210, M = 18;
      const colW = (W - M * 2 - 8) / 2;
      let x = M, y = M;

      // Background
      doc.setFillColor(250, 246, 239);
      doc.rect(0, 0, W, 297, 'F');

      // Header bar
      doc.setFillColor(61, 43, 31);
      doc.rect(0, 0, W, 28, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(7);
      doc.setFont('helvetica', 'normal');
      doc.text('PLANIFICACIÓN', W / 2, 10, { align: 'center' });
      doc.setFontSize(18);
      doc.setFont('helvetica', 'bold');
      doc.text('MENÚ SEMANAL', W / 2, 20, { align: 'center' });

      // Accent line
      doc.setFillColor(196, 98, 45);
      doc.rect(M, 30, W - M * 2, 1.2, 'F');

      y = 38;

      const typeColors = {
        'Desayuno': [255, 243, 224],
        'Almuerzo': [232, 244, 234],
        'Snack': [252, 232, 243]
      };
      const typeText = {
        'Desayuno': [224, 123, 57],
        'Almuerzo': [74, 140, 86],
        'Snack': [181, 84, 138]
      };

      DAYS.forEach((day, di) => {
        const meals = Object.entries(weekMenu[di]);
        const mealH = meals.length * 12 + 14;

        const col = di % 2;
        const xPos = M + col * (colW + 8);
        if (col === 0 && di > 0) { y += mealH + 6; }

        // Check new page
        if (y + mealH > 280) { doc.addPage(); y = 18; doc.setFillColor(250, 246, 239); doc.rect(0, 0, W, 297, 'F'); }

        // Card bg
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(xPos, y, colW, mealH, 3, 3, 'F');
        doc.setDrawColor(214, 201, 180);
        doc.setLineWidth(0.4);
        doc.roundedRect(xPos, y, colW, mealH, 3, 3, 'S');

        // Day header
        doc.setFillColor(61, 43, 31);
        doc.roundedRect(xPos, y, colW, 10, 3, 3, 'F');
        doc.rect(xPos, y + 5, colW, 5, 'F');

        doc.setTextColor(255, 255, 255);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'bold');
        doc.text(day.toUpperCase(), xPos + 6, y + 7);

        let ry = y + 13;
        meals.forEach(([type, dish]) => {
          // Badge bg
          const bc = typeColors[type] || [240, 240, 240];
          const tc = typeText[type] || [100, 100, 100];
          doc.setFillColor(...bc);
          doc.roundedRect(xPos + 4, ry - 3, 18, 5, 1.5, 1.5, 'F');
          doc.setTextColor(...tc);
          doc.setFontSize(5.5);
          doc.setFont('helvetica', 'bold');
          doc.text(type.toUpperCase(), xPos + 13, ry + 0.5, { align: 'center' });

          doc.setTextColor(61, 43, 31);
          doc.setFontSize(7.5);
          doc.setFont('helvetica', 'bold');
          const nameLines = doc.splitTextToSize(dish.name, colW - 30);
          doc.text(nameLines, xPos + 25, ry + 0.5);

          if (dish.extras) {
            const eLine = `+ ${dish.extras}`;
            doc.setTextColor(107, 124, 92);
            doc.setFontSize(6);
            doc.setFont('helvetica', 'italic');
            doc.text(doc.splitTextToSize(eLine, colW - 10), xPos + 6, ry + 6);
            ry += 12;
          } else {
            ry += 10;
          }
        });

        if (col === 1 || di === DAYS.length - 1) {
          const leftH = di % 2 === 0 ? mealH : null;
          // if last column advance y
        }
      });

      // Footer
      doc.setFillColor(61, 43, 31);
      doc.rect(0, 287, W, 10, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(6);
      doc.setFont('helvetica', 'normal');
      doc.text('Menú Semanal — Generado automáticamente', W / 2, 293, { align: 'center' });

      doc.save('menu_semanal.pdf');
      showToast('✓ PDF descargado');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Cargar platillos y generar menú al inicio
    fetch('platillos.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('No se pudo cargar el archivo platillos.json');
        }
        return response.json();
      })
      .then(data => {
        dishes = data;
        generateRandom();
      })
      .catch(error => {
        console.error('Error al cargar los platillos:', error);
        showToast('Error al cargar platillos');
        if (window.location.protocol === 'file:') {
          console.warn('Nota: Los navegadores bloquean peticiones fetch() locales por seguridad usando el protocolo file://. Se recomienda usar un servidor web local.');
        }
      });

  </script>
</body>

</html>
