<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="theme-toggle">
                <button id="theme-toggle-btn" class="theme-btn" onclick="toggleTheme()" aria-label="Cambiar tema">
                    <span class="material-icons-round" id="theme-toggle-icon">dark_mode</span>
                </button>
            </div>
            <span class="material-icons-round header-logo-icon">dashboard</span>
            <h1>ToolsObs</h1>
        </div>

        <div class="grid">
            <!-- Menú Semanal Card -->
            <a href="menu_semanal.html" class="card card-menu">
                <div class="icon-wrapper menu-icon">
                    <span class="material-icons-round">calendar_today</span>
                </div>
                <h2>Menú Semanal</h2>
            </a>

            <!-- Calculadora de Cerveza Card -->
            <a href="beer-calc.html" class="card card-beer">
                <div class="icon-wrapper beer-icon">
                    <span class="material-icons-round">sports_bar</span>
                </div>
                <h2>Calculadora de Cervezas</h2>
            </a>

            <!-- Control de Horarios Card -->
            <a href="Horarios.html" class="card card-schedule">
                <div class="icon-wrapper schedule-icon">
                    <span class="material-icons-round">schedule</span>
                </div>
                <h2>Control de Horarios</h2>
            </a>
        </div>

        <footer>
            Hecho por Ob Sandoval
        </footer>
    </div>

    <script>
        // Load theme preference on load
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('index_theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-toggle-icon').innerText = 'light_mode';
            }
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = 'light';
            let iconText = 'dark_mode';
            if (currentTheme !== 'dark') {
                newTheme = 'dark';
                iconText = 'light_mode';
            }
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('theme-toggle-icon').innerText = iconText;
            localStorage.setItem('index_theme', newTheme);
        }
    </script>
</body>

</html>
